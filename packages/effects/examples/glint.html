<!-- Glint: the TV's shine. A band two pixels white with a light edge each side sweeps down and right across a candy
     box in five frames, 80 ms apart, every 4.5 seconds, inside the outline. Add a .pp-glint span to any .pp-box.
     The bottom row holds each of the five frames (data-frame), for docs and tests. -->
<div style="display:grid;gap:calc(8*var(--pp-pixel))">
  <div style="display:flex;flex-wrap:wrap;gap:calc(6*var(--pp-pixel));align-items:center">
    <div class="pp-box" data-tone="red" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true"></span></div>
    <div class="pp-box" data-tone="blue" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" style="--pp-glint-delay:600ms"></span></div>
    <div class="pp-box" data-tone="teal" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" style="--pp-glint-delay:1200ms"></span></div>
    <button class="pp-box pp-button" type="button">Continue<span class="pp-glint" aria-hidden="true"></span></button>
    <button class="pp-box pp-button" type="button" data-size="lg" data-tone="pink">Start game<span class="pp-glint" aria-hidden="true" style="--pp-glint-delay:800ms"></span></button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:calc(6*var(--pp-pixel));align-items:center">
    <div class="pp-box" data-tone="red" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" data-frame="0"></span></div>
    <div class="pp-box" data-tone="red" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" data-frame="1"></span></div>
    <div class="pp-box" data-tone="red" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" data-frame="2"></span></div>
    <div class="pp-box" data-tone="red" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" data-frame="3"></span></div>
    <div class="pp-box" data-tone="red" style="inline-size:calc(28*var(--pp-pixel));block-size:calc(28*var(--pp-pixel));--pp-band-top:5;--pp-band-bottom:4"><span class="pp-glint" aria-hidden="true" data-frame="4"></span></div>
    <button class="pp-box pp-button" type="button" data-tone="green">Claim reward<span class="pp-glint" aria-hidden="true" data-frame="2"></span></button>
  </div>
</div>

<!-- CRT: dithered ink scanlines (one pixel in four on every other row) and an ink vignette dithered round the edge,
     over whatever is inside; no blur and no wash. Text under it is big (POP and Pixel Bop), so every letter survives a
     dot of ink; a control's label is too small, so controls go outside it. data-flicker swaps the scanlines to the
     rows between them for a frame now and then, for six beats (not with reduced motion). -->
<div style="display:flex;flex-wrap:wrap;gap:calc(8*var(--blip-pixel));align-items:start">
  <div class="blip-crt" style="inline-size:calc(160*var(--blip-pixel));aspect-ratio:16/9;display:grid;place-content:center;justify-items:center;gap:calc(3*var(--blip-pixel))">
    <blip-world scheme="night" clouds="none"></blip-world>
    <p class="blip-display blip-pop" data-scale="2" data-pop="Press start">Press start</p>
    <p class="blip-display blip-outline" data-scale="1">1 or 2 players</p>
  </div>
  <div class="blip-crt" data-flicker style="display:inline-block">
    <div class="blip-box" data-variant="panel" style="padding:calc(8*var(--blip-pixel));display:grid;gap:calc(4*var(--blip-pixel));inline-size:calc(120*var(--blip-pixel))">
      <p class="blip-display" data-scale="1" style="margin:0">High scores</p>
      <ol class="blip-display" data-scale="1" style="margin:0;padding-inline-start:calc(10*var(--blip-pixel))"><li>Ada 12 400</li><li>Kim 9 850</li><li>Sol 7 300</li></ol>
    </div>
  </div>
</div>

<!-- Typewriter: types a letter every 50 ms and holds after a full stop (260 ms) or a comma (130 ms), as the TV's
     speech bubble does. With blips, every other letter plays the blip voice once sound is on (see the sound board);
     mood="happy" or "sleepy" pitches it up or down. caret adds a blinking block. The untyped rest keeps its room. -->
<div style="display:grid;gap:calc(6*var(--pp-pixel));max-inline-size:calc(220*var(--pp-pixel))">
  <div class="pp-box" data-variant="panel" style="padding:calc(6*var(--pp-pixel)) calc(8*var(--pp-pixel))">
    <pp-typewriter class="pp-body" caret blips>Welcome back! Your save is ready, and the coins you found are still in your pocket.</pp-typewriter>
  </div>
  <div class="pp-box" data-variant="panel" data-pp-r="4" style="padding:calc(6*var(--pp-pixel)) calc(8*var(--pp-pixel))">
    <pp-typewriter class="pp-display" data-scale="1" mood="happy" blips>Wow, you found the secret level!</pp-typewriter>
  </div>
  <div style="display:flex;gap:calc(4*var(--pp-pixel))">
    <button class="pp-box pp-button" type="button" data-size="sm" onclick="this.closest('div').parentElement.querySelectorAll('pp-typewriter').forEach((t) => t.play())">Type again</button>
    <button class="pp-box pp-button" type="button" data-size="sm" data-variant="soft" onclick="this.closest('div').parentElement.querySelectorAll('pp-typewriter').forEach((t) => t.finish())">Skip</button>
  </div>
</div>

<!-- Attract mode: a short demo of real markup, played by a pixel pointer from a script and looping while it is on
     screen. The pointer hops to the field, types a character a pop, hops to Save and presses it; the button's own
     click shows a toast, which comes up in the demo's corner, over earlier notes drawn as filler bars (words only
     where the story is). The second plays a game's pause menu with the glove:
     Music flips on. Each demo is one image to assistive technology, named by its label, and its controls are inert.
     It is motion that runs on, so the page shows the motion toggle: pressed, both demos stop at once on their still
     frame (the step marked poster, or the end); pressed again, they play on. -->
<blip-motion-toggle></blip-motion-toggle>

<div style="display:flex;flex-wrap:wrap;gap:calc(8*var(--blip-pixel));align-items:start;margin-block-start:calc(8*var(--blip-pixel))">
  <blip-attract label="Typing a note and pressing Save shows a toast: Saved."
              script="move #attract-title; type #attract-title 'Ship it'; move #attract-save; press #attract-save; poster; wait 2s"
              style="inline-size:calc(200*var(--blip-pixel));padding:calc(4*var(--blip-pixel))">
    <section class="blip-box blip-window" aria-labelledby="attract-notes">
      <header class="blip-window-bar"><h3 class="blip-window-title blip-display blip-pop" id="attract-notes">Notes</h3></header>
      <div class="blip-window-body blip-stack" data-gap="6">
        <div style="display:flex;gap:calc(4*var(--blip-pixel))">
          <span class="blip-box blip-input" style="flex:1"><input id="attract-title" aria-label="New note" placeholder="New note" autocomplete="off"></span>
          <button class="blip-box blip-button" id="attract-save" type="button" onclick="this.closest('blip-attract').querySelector('blip-toaster').add({ title: 'Saved', body: 'Ship it is in your notes.', tone: 'success', duration: 0 })">Save</button>
        </div>
        <ul class="blip-box blip-list" role="list" data-dividers data-density="compact" aria-label="Earlier notes">
          <li class="blip-list-item"><span style="display:block;inline-size:60%;block-size:calc(4*var(--blip-pixel));background:var(--blip-line-soft)"></span></li>
          <li class="blip-list-item"><span style="display:block;inline-size:45%;block-size:calc(4*var(--blip-pixel));background:var(--blip-line-soft)"></span></li>
          <li class="blip-list-item"><span style="display:block;inline-size:70%;block-size:calc(4*var(--blip-pixel));background:var(--blip-line-soft)"></span></li>
        </ul>
      </div>
    </section>
    <blip-toaster></blip-toaster>
  </blip-attract>

  <blip-attract label="Pressing Music in the pause menu turns the music on." pointer="glove"
              script="move #attract-music; press #attract-music; poster; wait 2s"
              style="inline-size:calc(120*var(--blip-pixel));padding:calc(4*var(--blip-pixel))">
    <section class="blip-box blip-window" data-tone="purple" aria-labelledby="attract-pause">
      <header class="blip-window-bar"><h3 class="blip-window-title blip-display blip-pop" id="attract-pause">Paused</h3></header>
      <div class="blip-window-body blip-stack" data-gap="4">
        <label class="blip-check" data-layout="split">Sound<span class="blip-box blip-switch"><input type="checkbox" role="switch" class="blip-box" checked></span></label>
        <label class="blip-check" data-layout="split">Music<span class="blip-box blip-switch"><input type="checkbox" role="switch" class="blip-box" id="attract-music"></span></label>
      </div>
    </section>
  </blip-attract>
</div>

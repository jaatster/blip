<!-- Attract mode: a short demo of real markup, played by a pixel pointer from a script and looping while it is on
     screen. The pointer hops to the field, types a character a pop, hops to Save and presses it; the button's own
     click shows a toast, which comes up in the demo's corner, over earlier notes drawn as filler bars (words only
     where the story is). The second plays a game's pause menu with the glove:
     Music flips on. Each demo is one image to assistive technology, named by its label, and its controls are inert.
     It is motion that runs on, so the page shows the motion toggle: pressed, both demos stop at once on their still
     frame (the step marked poster, or the end); pressed again, they play on. -->
<chu-motion-toggle></chu-motion-toggle>

<div style="display:flex;flex-wrap:wrap;gap:calc(8*var(--chu-pixel));align-items:start;margin-block-start:calc(8*var(--chu-pixel))">
  <chu-attract label="Typing a note and pressing Save shows a toast: Saved."
              script="move #attract-title; type #attract-title 'Ship it'; move #attract-save; press #attract-save; poster; wait 2s"
              style="inline-size:calc(200*var(--chu-pixel));padding:calc(4*var(--chu-pixel))">
    <section class="chu-box chu-window" aria-labelledby="attract-notes">
      <header class="chu-window-bar"><h3 class="chu-window-title chu-display chu-pop" id="attract-notes">Notes</h3></header>
      <div class="chu-window-body chu-stack" data-gap="6">
        <div style="display:flex;gap:calc(4*var(--chu-pixel))">
          <span class="chu-box chu-input" style="flex:1"><input id="attract-title" aria-label="New note" placeholder="New note" autocomplete="off"></span>
          <button class="chu-box chu-button" id="attract-save" type="button" onclick="this.closest('chu-attract').querySelector('chu-toaster').add({ title: 'Saved', body: 'Ship it is in your notes.', tone: 'success', duration: 0 })">Save</button>
        </div>
        <ul class="chu-box chu-list" role="list" data-dividers data-density="compact" aria-label="Earlier notes">
          <li class="chu-list-item"><span style="display:block;inline-size:60%;block-size:calc(4*var(--chu-pixel));background:var(--chu-line-soft)"></span></li>
          <li class="chu-list-item"><span style="display:block;inline-size:45%;block-size:calc(4*var(--chu-pixel));background:var(--chu-line-soft)"></span></li>
          <li class="chu-list-item"><span style="display:block;inline-size:70%;block-size:calc(4*var(--chu-pixel));background:var(--chu-line-soft)"></span></li>
        </ul>
      </div>
    </section>
    <chu-toaster></chu-toaster>
  </chu-attract>

  <chu-attract label="Pressing Music in the pause menu turns the music on." pointer="glove"
              script="move #attract-music; press #attract-music; poster; wait 2s"
              style="inline-size:calc(120*var(--chu-pixel));padding:calc(4*var(--chu-pixel))">
    <section class="chu-box chu-window" data-tone="purple" aria-labelledby="attract-pause">
      <header class="chu-window-bar"><h3 class="chu-window-title chu-display chu-pop" id="attract-pause">Paused</h3></header>
      <div class="chu-window-body chu-stack" data-gap="4">
        <label class="chu-check" data-layout="split">Sound<span class="chu-box chu-switch"><input type="checkbox" role="switch" class="chu-box" checked></span></label>
        <label class="chu-check" data-layout="split">Music<span class="chu-box chu-switch"><input type="checkbox" role="switch" class="chu-box" id="attract-music"></span></label>
      </div>
    </section>
  </chu-attract>
</div>

<!-- A large title: the big title is the screen's heading and slides up under the bar as you scroll; the bar's own
     title (a copy, hidden from screen readers) steps in as it goes. Scroll the frame to see the hand-over. -->
<div class="blip-box" data-variant="panel" data-blip-r="4" style="display:grid;inline-size:min(100%,calc(180*var(--blip-pixel)));block-size:calc(170*var(--blip-pixel))">

<!-- A detail screen: a top bar with a labelled back button and two actions, over a list, with an action button for
     the screen's main action. The frame stands in for a phone; on a real screen the bar sticks to the top of the page
     and the action button floats over the screen (leave out data-position). -->
<div class="blip-box" data-variant="panel" data-blip-r="4" style="display:grid;inline-size:min(100%,calc(180*var(--blip-pixel)));block-size:calc(170*var(--blip-pixel))">
  <div style="display:flex;flex-direction:column;overflow:auto;mask-image:var(--blip-shape-inner);mask-size:var(--blip-box-mask-size);mask-position:var(--blip-box-mask-position);mask-repeat:no-repeat">
    <header class="blip-box blip-top-bar">
      <a class="blip-box blip-button blip-top-bar-back" data-variant="ghost" href="#tb-worlds"><span class="blip-icon blip-top-bar-chevron" aria-hidden="true"></span><span class="blip-sr-only">Back to </span>Worlds</a>
      <h2 class="blip-top-bar-title">Meadow</h2>
      <div class="blip-top-bar-actions">
        <button class="blip-box blip-button" type="button" data-variant="ghost" data-icon-only aria-label="Share"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M8 1h2v1h1v2h-1v1H8V4H7v1H6v2h1v1h1V7h2v1h1v2h-1v1H8v-1H7V9H6V8H5V7H4v1H2V7H1V5h1V4h2v1h1V4h1V3h1V2h1z"/></svg></button>
        <button class="blip-box blip-button" type="button" data-variant="ghost" data-icon-only aria-label="More"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v2H5zm0 4h2v2H5zm0 4h2v2H5z"/></svg></button>
      </div>
    </header>
    <ul class="blip-list" role="list" data-dividers aria-label="Levels" style="padding:calc(2*var(--blip-pixel)) calc(4*var(--blip-pixel)) calc(36*var(--blip-pixel))">
      <li><a class="blip-box blip-list-item" data-variant="ghost" href="#tb-level-1"><div class="blip-list-content"><span class="blip-list-title">1. First steps</span><span class="blip-list-description">3 of 3 stars</span></div></a></li>
      <li><a class="blip-box blip-list-item" data-variant="ghost" href="#tb-level-2"><div class="blip-list-content"><span class="blip-list-title">2. Windy ridge</span><span class="blip-list-description">2 of 3 stars</span></div></a></li>
      <li><a class="blip-box blip-list-item" data-variant="ghost" href="#tb-level-3"><div class="blip-list-content"><span class="blip-list-title">3. Mushroom caves</span><span class="blip-list-description">Not played yet</span></div></a></li>
      <li><a class="blip-box blip-list-item" data-variant="ghost" href="#tb-level-4"><div class="blip-list-content"><span class="blip-list-title">4. Dragon's nap</span><span class="blip-list-description">Locked</span></div></a></li>
      <li><a class="blip-box blip-list-item" data-variant="ghost" href="#tb-level-5"><div class="blip-list-content"><span class="blip-list-title">5. Frog pond</span><span class="blip-list-description">Locked</span></div></a></li>
    </ul>
  </div>
  <button class="blip-box blip-fab" type="button" data-position="absolute"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2h2v1h2v1h2v1h2v2H9v1H7v1H5v1H3z"/></svg>Play next</button>
</div>

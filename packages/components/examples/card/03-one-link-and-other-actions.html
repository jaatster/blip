<!-- One main link that covers the card (blip-card-link, with data-blip-interactive), and buttons that stay their own targets. -->
<article class="blip-box blip-card" data-blip-interactive data-tone="purple" style="max-inline-size:calc(160*var(--blip-pixel))">
  <header class="blip-card-header">
    <div><h3 class="blip-card-title"><a class="blip-card-link" href="#night-woods">Night woods</a></h3><p class="blip-card-subtitle">World 2 · 3 of 10 levels</p></div>
    <span class="blip-box blip-tag" data-tone="purple">New</span>
  </header>
  <p class="blip-card-body">Owls, fireflies and a path that changes after dark.</p>
  <footer class="blip-card-footer">
    <button class="blip-box blip-button" data-variant="ghost" data-size="sm">Details</button>
    <button class="blip-box blip-button" data-size="sm">Continue</button>
  </footer>
</article>

<!-- One main link that covers the card (chu-card-link, with data-chu-interactive), and buttons that stay their own targets. -->
<article class="chu-box chu-card" data-chu-interactive data-tone="purple" style="max-inline-size:calc(160*var(--chu-pixel))">
  <header class="chu-card-header">
    <div><h3 class="chu-card-title"><a class="chu-card-link" href="#night-woods">Night woods</a></h3><p class="chu-card-subtitle">World 2 · 3 of 10 levels</p></div>
    <span class="chu-box chu-tag" data-tone="purple">New</span>
  </header>
  <p class="chu-card-body">Owls, fireflies and a path that changes after dark.</p>
  <footer class="chu-card-footer">
    <button class="chu-box chu-button" data-variant="ghost" data-size="sm">Details</button>
    <button class="chu-box chu-button" data-size="sm">Continue</button>
  </footer>
</article>

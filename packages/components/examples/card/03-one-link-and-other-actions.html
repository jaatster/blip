<!-- One main link that covers the card (pp-card-link, with data-pp-interactive), and buttons that stay their own targets. -->
<article class="pp-box pp-card" data-pp-interactive data-tone="purple" style="max-inline-size:calc(160*var(--pp-pixel))">
  <header class="pp-card-header">
    <div><h3 class="pp-card-title"><a class="pp-card-link" href="#night-woods">Night woods</a></h3><p class="pp-card-subtitle">World 2 · 3 of 10 levels</p></div>
    <span class="pp-box pp-tag" data-tone="purple">New</span>
  </header>
  <p class="pp-card-body">Owls, fireflies and a path that changes after dark.</p>
  <footer class="pp-card-footer">
    <button class="pp-box pp-button" data-variant="ghost" data-size="sm">Details</button>
    <button class="pp-box pp-button" data-size="sm">Continue</button>
  </footer>
</article>

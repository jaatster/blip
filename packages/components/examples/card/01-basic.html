<!-- A header with a title, a subtitle and a tag, a body, and actions in the footer. -->
<article class="chu-box chu-card" aria-labelledby="cs-meadow" style="max-inline-size:calc(160*var(--chu-pixel))">
  <header class="chu-card-header">
    <div>
      <h3 class="chu-card-title" id="cs-meadow">Meadow</h3>
      <p class="chu-card-subtitle">World 1 · 8 levels</p>
    </div>
    <span class="chu-box chu-tag" data-tone="success">Cleared</span>
  </header>
  <div class="chu-card-body"><p>Rolling hills, slow clouds and the first boss.</p></div>
  <footer class="chu-card-footer">
    <button class="chu-box chu-button" data-variant="soft" data-size="sm">Details</button>
    <button class="chu-box chu-button" data-size="sm">Play</button>
  </footer>
</article>

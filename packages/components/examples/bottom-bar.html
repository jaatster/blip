<!-- Bottom bar: a phone screen (a narrow frame that scrolls, so the bar sticks to its foot) with five destinations and
     a count, a three-item bar with a dot, and the item states forced with data-pp-state. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(12*var(--pp-pixel));align-items:start">

  <div class="pp-box" data-variant="panel" data-pp-r="6" style="inline-size:calc(195*var(--pp-pixel));max-block-size:calc(150*var(--pp-pixel));overflow-y:auto;display:flex;flex-direction:column">
    <div style="padding:calc(8*var(--pp-pixel)) calc(8*var(--pp-pixel)) calc(24*var(--pp-pixel));display:grid;gap:calc(4*var(--pp-pixel))">
      <h3 class="pp-display pp-pop" data-scale="1" data-pop="Today">Today</h3>
      <p class="pp-body">Daily challenge: clear World 3 without losing a heart.</p>
      <p class="pp-small pp-muted">Ends in 4 hours. 1,204 players are trying it.</p>
    </div>
    <nav class="pp-box pp-bottom-bar" aria-label="Main" data-collapse="auto">
      <ul class="pp-bottom-bar-list" role="list">
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#today" aria-current="page"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h1v1h1v1h1v1h1v1h-1v5H7V7H5v4H2V6H1V5h1V4h1V3h1V2h1z"/></svg><span class="pp-bottom-bar-label">Today</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#worlds"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h10v2h-1v1H9v1h1v1h1v1H3v4H1z"/></svg><span class="pp-bottom-bar-label">Worlds</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#inbox"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h2v1h1v3h1v2H1V6h1V3h1V2h2zM4 9h4v1H7v1H5v-1H4z"/></svg><span class="pp-bottom-bar-label">Inbox</span><span class="pp-box pp-bottom-bar-badge" data-tone="danger">3<span class="pp-sr-only"> new</span></span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#shop"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1h6v2h2v8H1V3h2zm2 1v1h2V2z"/></svg><span class="pp-bottom-bar-label">Shop</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#me"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1h4v1h1v3H8v1H4V5H3V2h1zM2 7h8v1h1v3H1V8h1z"/></svg><span class="pp-bottom-bar-label">Me</span></a></li>
      </ul>
    </nav>
  </div>

  <div style="display:grid;gap:calc(8*var(--pp-pixel));inline-size:calc(150*var(--pp-pixel))">
    <nav class="pp-box pp-bottom-bar" aria-label="Studio">
      <ul class="pp-bottom-bar-list" role="list">
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#build"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h4v4H1zm6 0h4v4H7zM1 7h4v4H1zm6 0h4v4H7z"/></svg><span class="pp-bottom-bar-label">Build</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#stats" aria-current="page"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M9 1h2v7H9zM5 3h2v5H5zM1 5h2v3H1zm0 4h10v2H1z"/></svg><span class="pp-bottom-bar-label">Stats</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#chat"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h2v1h1v3h1v2H1V6h1V3h1V2h2zM4 9h4v1H7v1H5v-1H4z"/></svg><span class="pp-bottom-bar-label">Alerts</span><span class="pp-box pp-bottom-bar-badge" data-tone="danger" data-dot><span class="pp-sr-only">, new</span></span></a></li>
      </ul>
    </nav>

    <!-- States, forced. -->
    <nav class="pp-box pp-bottom-bar" aria-label="Bottom bar states">
      <ul class="pp-bottom-bar-list" role="list">
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#rest"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2V2h3v1h1v3h-1v1H9v1H8v1H7v1H5V9H4V8H3V7H2V6H1V3h1z"/></svg><span class="pp-bottom-bar-label">Rest</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#hover" data-pp-state="hover"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2V2h3v1h1v3h-1v1H9v1H8v1H7v1H5V9H4V8H3V7H2V6H1V3h1z"/></svg><span class="pp-bottom-bar-label">Hover</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#focus" data-pp-state="focus"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2V2h3v1h1v3h-1v1H9v1H8v1H7v1H5V9H4V8H3V7H2V6H1V3h1z"/></svg><span class="pp-bottom-bar-label">Focus</span></a></li>
        <li><a class="pp-box pp-bottom-bar-item" data-variant="ghost" href="#current" aria-current="page"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2V2h3v1h1v3h-1v1H9v1H8v1H7v1H5V9H4V8H3V7H2V6H1V3h1z"/></svg><span class="pp-bottom-bar-label">Here</span></a></li>
      </ul>
    </nav>
  </div>
</div>

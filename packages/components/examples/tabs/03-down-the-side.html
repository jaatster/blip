<!-- Soft tabs down the side (aria-orientation="vertical"), with icons. activation="manual": arrows move, Enter or Space opens. -->
<chu-tabs class="chu-tabs" data-variant="soft" activation="manual">
  <div class="chu-tabs-list" role="tablist" aria-label="Account" aria-orientation="vertical">
    <button class="chu-box chu-tab" data-variant="soft" role="tab" aria-selected="true"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1h4v1h1v3H8v1H4V5H3V2h1zM2 7h8v1h1v3H1V8h1z"/></svg>Profile</button>
    <button class="chu-box chu-tab" data-variant="soft" role="tab" aria-selected="false" tabindex="-1"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1h4v1h1v3h1v6H2V5h1V2h1zm1 2v2h2V3zm0 4v2h2V7z"/></svg>Security</button>
    <button class="chu-box chu-tab" data-variant="soft" role="tab" aria-selected="false" tabindex="-1"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h2v1h1v3h1v2H1V6h1V3h1V2h2zM4 9h4v1H7v1H5v-1H4z"/></svg>Alerts</button>
  </div>
  <div class="chu-tabs-panel" role="tabpanel"><p class="chu-body">Name, avatar and the world you start in.</p></div>
  <div class="chu-tabs-panel" role="tabpanel" hidden><p class="chu-body">Password and two-step sign-in.</p></div>
  <div class="chu-tabs-panel" role="tabpanel" hidden><p class="chu-body">Tell me when a friend comes online.</p></div>
</chu-tabs>

<!-- Dense underline tabs for a toolbar or a table's filters, each with a count. -->
<pp-tabs class="pp-tabs" data-variant="underline" data-size="sm">
  <div class="pp-tabs-list" role="tablist" aria-label="Players">
    <button class="pp-box pp-tab" data-variant="ghost" role="tab" aria-selected="true">Online <span class="pp-muted">128</span></button>
    <button class="pp-box pp-tab" data-variant="ghost" role="tab" aria-selected="false" tabindex="-1">Banned <span class="pp-muted">3</span></button>
    <button class="pp-box pp-tab" data-variant="ghost" role="tab" aria-selected="false" tabindex="-1">Reports <span class="pp-muted">12</span></button>
  </div>
  <div class="pp-tabs-panel" role="tabpanel"><p class="pp-small pp-muted">128 players online in 9 worlds.</p></div>
  <div class="pp-tabs-panel" role="tabpanel" hidden><p class="pp-small pp-muted">3 accounts banned this week.</p></div>
  <div class="pp-tabs-panel" role="tabpanel" hidden><p class="pp-small pp-muted">12 reports waiting for review.</p></div>
</pp-tabs>

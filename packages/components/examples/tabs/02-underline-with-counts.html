<!-- Dense underline tabs for a toolbar or a table's filters, each with a count. -->
<blip-tabs class="blip-tabs" data-variant="underline" data-size="sm">
  <div class="blip-tabs-list" role="tablist" aria-label="Players">
    <button class="blip-box blip-tab" data-variant="ghost" role="tab" aria-selected="true">Online <span class="blip-muted">128</span></button>
    <button class="blip-box blip-tab" data-variant="ghost" role="tab" aria-selected="false" tabindex="-1">Banned <span class="blip-muted">3</span></button>
    <button class="blip-box blip-tab" data-variant="ghost" role="tab" aria-selected="false" tabindex="-1">Reports <span class="blip-muted">12</span></button>
  </div>
  <div class="blip-tabs-panel" role="tabpanel"><p class="blip-small blip-muted">128 players online in 9 worlds.</p></div>
  <div class="blip-tabs-panel" role="tabpanel" hidden><p class="blip-small blip-muted">3 accounts banned this week.</p></div>
  <div class="blip-tabs-panel" role="tabpanel" hidden><p class="blip-small blip-muted">12 reports waiting for review.</p></div>
</blip-tabs>

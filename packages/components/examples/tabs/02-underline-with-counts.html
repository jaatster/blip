<!-- Dense underline tabs for a toolbar or a table's filters, each with a count. -->
<chu-tabs class="chu-tabs" data-variant="underline" data-size="sm">
  <div class="chu-tabs-list" role="tablist" aria-label="Players">
    <button class="chu-box chu-tab" data-variant="ghost" role="tab" aria-selected="true">Online <span class="chu-muted">128</span></button>
    <button class="chu-box chu-tab" data-variant="ghost" role="tab" aria-selected="false" tabindex="-1">Banned <span class="chu-muted">3</span></button>
    <button class="chu-box chu-tab" data-variant="ghost" role="tab" aria-selected="false" tabindex="-1">Reports <span class="chu-muted">12</span></button>
  </div>
  <div class="chu-tabs-panel" role="tabpanel"><p class="chu-small chu-muted">128 players online in 9 worlds.</p></div>
  <div class="chu-tabs-panel" role="tabpanel" hidden><p class="chu-small chu-muted">3 accounts banned this week.</p></div>
  <div class="chu-tabs-panel" role="tabpanel" hidden><p class="chu-small chu-muted">12 reports waiting for review.</p></div>
</chu-tabs>

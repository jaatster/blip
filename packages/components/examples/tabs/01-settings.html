<!-- Outline tabs over a panel. <chu-tabs> wires the ids and the arrow keys; without it the selected panel still shows. -->
<chu-tabs class="chu-tabs" data-variant="outline">
  <div class="chu-tabs-list" role="tablist" aria-label="Settings">
    <button class="chu-box chu-tab" data-variant="outline" role="tab" aria-selected="true">General</button>
    <button class="chu-box chu-tab" data-variant="outline" role="tab" aria-selected="false" tabindex="-1">Sound</button>
    <button class="chu-box chu-tab" data-variant="outline" role="tab" aria-selected="false" tabindex="-1">Display</button>
  </div>
  <section class="chu-box chu-tabs-panel" data-variant="panel" role="tabpanel" style="padding:calc(8*var(--chu-pixel))">
    <p class="chu-body">Language, save slots and what happens when you start the game.</p>
  </section>
  <section class="chu-box chu-tabs-panel" data-variant="panel" role="tabpanel" hidden style="padding:calc(8*var(--chu-pixel))">
    <p class="chu-body">Music at 60%, chip sounds on, voices off.</p>
  </section>
  <section class="chu-box chu-tabs-panel" data-variant="panel" role="tabpanel" hidden style="padding:calc(8*var(--chu-pixel))">
    <p class="chu-body">Pixel size 2, the Auto scheme, scanlines off.</p>
  </section>
</chu-tabs>

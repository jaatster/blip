<!-- Outline tabs over a panel. <pp-tabs> wires the ids and the arrow keys; without it the selected panel still shows. -->
<pp-tabs class="pp-tabs" data-variant="outline">
  <div class="pp-tabs-list" role="tablist" aria-label="Settings">
    <button class="pp-box pp-tab" data-variant="outline" role="tab" aria-selected="true">General</button>
    <button class="pp-box pp-tab" data-variant="outline" role="tab" aria-selected="false" tabindex="-1">Sound</button>
    <button class="pp-box pp-tab" data-variant="outline" role="tab" aria-selected="false" tabindex="-1">Display</button>
  </div>
  <section class="pp-box pp-tabs-panel" data-variant="panel" role="tabpanel" style="padding:calc(8*var(--pp-pixel))">
    <p class="pp-body">Language, save slots and what happens when you start the game.</p>
  </section>
  <section class="pp-box pp-tabs-panel" data-variant="panel" role="tabpanel" hidden style="padding:calc(8*var(--pp-pixel))">
    <p class="pp-body">Music at 60%, chip sounds on, voices off.</p>
  </section>
  <section class="pp-box pp-tabs-panel" data-variant="panel" role="tabpanel" hidden style="padding:calc(8*var(--pp-pixel))">
    <p class="pp-body">Pixel size 2, the Auto scheme, scanlines off.</p>
  </section>
</pp-tabs>

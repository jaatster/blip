<!-- Outline tabs over a panel. <blip-tabs> wires the ids and the arrow keys; without it the selected panel still shows. -->
<blip-tabs class="blip-tabs" data-variant="outline">
  <div class="blip-tabs-list" role="tablist" aria-label="Settings">
    <button class="blip-box blip-tab" data-variant="outline" role="tab" aria-selected="true">General</button>
    <button class="blip-box blip-tab" data-variant="outline" role="tab" aria-selected="false" tabindex="-1">Sound</button>
    <button class="blip-box blip-tab" data-variant="outline" role="tab" aria-selected="false" tabindex="-1">Display</button>
  </div>
  <section class="blip-box blip-tabs-panel" data-variant="panel" role="tabpanel" style="padding:calc(8*var(--blip-pixel))">
    <p class="blip-body">Language, save slots and what happens when you start the game.</p>
  </section>
  <section class="blip-box blip-tabs-panel" data-variant="panel" role="tabpanel" hidden style="padding:calc(8*var(--blip-pixel))">
    <p class="blip-body">Music at 60%, chip sounds on, voices off.</p>
  </section>
  <section class="blip-box blip-tabs-panel" data-variant="panel" role="tabpanel" hidden style="padding:calc(8*var(--blip-pixel))">
    <p class="blip-body">Pixel size 2, the Auto scheme, scanlines off.</p>
  </section>
</blip-tabs>

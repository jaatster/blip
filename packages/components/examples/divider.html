<!-- Divider: solid, dashed and dithered, quiet and strong, labelled (centred, start, end), upright in a row. -->
<hr class="pp-divider">
<hr class="pp-divider" data-variant="dashed">
<hr class="pp-divider" data-variant="dither">
<hr class="pp-divider" data-strong>
<hr class="pp-divider" data-variant="dashed" data-strong>
<hr class="pp-divider" data-variant="dither" data-strong>

<div class="pp-divider">Today</div>
<div class="pp-divider" data-variant="dashed" data-align="start">Saved games</div>
<div class="pp-divider" data-variant="dither" data-align="end">or</div>

<div class="pp-cluster" data-gap="0" style="margin-block-start:calc(8*var(--pp-pixel))">
  <button class="pp-box pp-button" data-variant="ghost" data-size="sm" type="button">Undo</button>
  <button class="pp-box pp-button" data-variant="ghost" data-size="sm" type="button">Redo</button>
  <hr class="pp-divider" aria-orientation="vertical">
  <button class="pp-box pp-button" data-variant="ghost" data-size="sm" type="button">Copy</button>
  <hr class="pp-divider" aria-orientation="vertical" data-variant="dashed" data-strong>
  <button class="pp-box pp-button" data-variant="ghost" data-size="sm" type="button">Share</button>
  <hr class="pp-divider" aria-orientation="vertical" data-variant="dither">
  <button class="pp-box pp-button" data-variant="ghost" data-size="sm" type="button">Delete</button>
</div>

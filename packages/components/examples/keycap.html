<!-- Keycap: keys in running text, combinations, sizes, game prompts in tones, and a key held down. -->
<p class="chu-body">Press <kbd class="chu-box chu-keycap">Esc</kbd> to pause, or <kbd class="chu-keys"><kbd class="chu-box chu-keycap">Ctrl</kbd>+<kbd class="chu-box chu-keycap">K</kbd></kbd> to open the command palette. Move with <kbd class="chu-box chu-keycap">W</kbd> <kbd class="chu-box chu-keycap">A</kbd> <kbd class="chu-box chu-keycap">S</kbd> <kbd class="chu-box chu-keycap">D</kbd>.</p>

<div class="chu-cluster" data-gap="8" style="margin-block-start:calc(8*var(--chu-pixel))">
  <kbd class="chu-box chu-keycap" data-size="sm">Tab</kbd>
  <kbd class="chu-box chu-keycap">Tab</kbd>
  <kbd class="chu-box chu-keycap" data-size="lg">Tab</kbd>
  <kbd class="chu-keys"><kbd class="chu-box chu-keycap" data-size="lg">Shift</kbd>+<kbd class="chu-box chu-keycap" data-size="lg">Enter</kbd></kbd>
  <kbd class="chu-box chu-keycap" data-size="lg" data-chu-pressed>Space</kbd>
  <span class="chu-small chu-muted">(held down)</span>
</div>

<div class="chu-cluster" data-gap="8" style="margin-block-start:calc(8*var(--chu-pixel))">
  <kbd class="chu-box chu-keycap" data-size="lg" data-tone="green">A</kbd><span class="chu-small">Jump</span>
  <kbd class="chu-box chu-keycap" data-size="lg" data-tone="red">B</kbd><span class="chu-small">Back</span>
  <kbd class="chu-box chu-keycap" data-size="lg" data-tone="blue">X</kbd><span class="chu-small">Use item</span>
  <kbd class="chu-box chu-keycap" data-size="lg" data-tone="slate">Y</kbd><span class="chu-small">Map</span>
</div>

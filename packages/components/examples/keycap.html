<!-- Keycap: keys in running text, combinations, sizes, game prompts in tones, and a key held down. -->
<p class="blip-body">Press <kbd class="blip-box blip-keycap">Esc</kbd> to pause, or <kbd class="blip-keys"><kbd class="blip-box blip-keycap">Ctrl</kbd>+<kbd class="blip-box blip-keycap">K</kbd></kbd> to open the command palette. Move with <kbd class="blip-box blip-keycap">W</kbd> <kbd class="blip-box blip-keycap">A</kbd> <kbd class="blip-box blip-keycap">S</kbd> <kbd class="blip-box blip-keycap">D</kbd>.</p>

<div class="blip-cluster" data-gap="8" style="margin-block-start:calc(8*var(--blip-pixel))">
  <kbd class="blip-box blip-keycap" data-size="sm">Tab</kbd>
  <kbd class="blip-box blip-keycap">Tab</kbd>
  <kbd class="blip-box blip-keycap" data-size="lg">Tab</kbd>
  <kbd class="blip-keys"><kbd class="blip-box blip-keycap" data-size="lg">Shift</kbd>+<kbd class="blip-box blip-keycap" data-size="lg">Enter</kbd></kbd>
  <kbd class="blip-box blip-keycap" data-size="lg" data-blip-pressed>Space</kbd>
  <span class="blip-small blip-muted">(held down)</span>
</div>

<div class="blip-cluster" data-gap="8" style="margin-block-start:calc(8*var(--blip-pixel))">
  <kbd class="blip-box blip-keycap" data-size="lg" data-tone="green">A</kbd><span class="blip-small">Jump</span>
  <kbd class="blip-box blip-keycap" data-size="lg" data-tone="red">B</kbd><span class="blip-small">Back</span>
  <kbd class="blip-box blip-keycap" data-size="lg" data-tone="blue">X</kbd><span class="blip-small">Use item</span>
  <kbd class="blip-box blip-keycap" data-size="lg" data-tone="slate">Y</kbd><span class="blip-small">Map</span>
</div>

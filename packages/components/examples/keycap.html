<!-- Keycap: keys in running text, combinations, sizes, game prompts in tones, and a key held down. -->
<p class="pp-body">Press <kbd class="pp-box pp-keycap">Esc</kbd> to pause, or <kbd class="pp-keys"><kbd class="pp-box pp-keycap">Ctrl</kbd>+<kbd class="pp-box pp-keycap">K</kbd></kbd> to open the command palette. Move with <kbd class="pp-box pp-keycap">W</kbd> <kbd class="pp-box pp-keycap">A</kbd> <kbd class="pp-box pp-keycap">S</kbd> <kbd class="pp-box pp-keycap">D</kbd>.</p>

<div class="pp-cluster" data-gap="8" style="margin-block-start:calc(8*var(--pp-pixel))">
  <kbd class="pp-box pp-keycap" data-size="sm">Tab</kbd>
  <kbd class="pp-box pp-keycap">Tab</kbd>
  <kbd class="pp-box pp-keycap" data-size="lg">Tab</kbd>
  <kbd class="pp-keys"><kbd class="pp-box pp-keycap" data-size="lg">Shift</kbd>+<kbd class="pp-box pp-keycap" data-size="lg">Enter</kbd></kbd>
  <kbd class="pp-box pp-keycap" data-size="lg" data-pp-pressed>Space</kbd>
  <span class="pp-small pp-muted">(held down)</span>
</div>

<div class="pp-cluster" data-gap="8" style="margin-block-start:calc(8*var(--pp-pixel))">
  <kbd class="pp-box pp-keycap" data-size="lg" data-tone="green">A</kbd><span class="pp-small">Jump</span>
  <kbd class="pp-box pp-keycap" data-size="lg" data-tone="red">B</kbd><span class="pp-small">Back</span>
  <kbd class="pp-box pp-keycap" data-size="lg" data-tone="blue">X</kbd><span class="pp-small">Use item</span>
  <kbd class="pp-box pp-keycap" data-size="lg" data-tone="slate">Y</kbd><span class="pp-small">Map</span>
</div>

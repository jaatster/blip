<!-- Several choices under one legend, with help for the group and for one choice. -->
<fieldset class="pp-field" aria-describedby="cs-map-help">
  <legend class="pp-field-label">Show on the map</legend>
  <label class="pp-check"><span class="pp-box pp-checkbox"><input type="checkbox" checked></span>Shops</label>
  <label class="pp-check"><span class="pp-box pp-checkbox"><input type="checkbox" checked aria-describedby="cs-quests-help"></span>Quests</label>
  <p class="pp-check-help" id="cs-quests-help">Only the ones you have started.</p>
  <label class="pp-check"><span class="pp-box pp-checkbox"><input type="checkbox" disabled></span>Other players (online only)</label>
  <p class="pp-field-help" id="cs-map-help">Hidden things stay hidden until you find them.</p>
</fieldset>

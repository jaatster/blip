<!-- A box that must be ticked: the error is tied to it with aria-describedby, and aria-invalid turns it red. -->
<div class="chu-field" style="max-inline-size:calc(160*var(--chu-pixel))">
  <label class="chu-check"><span class="chu-box chu-checkbox"><input type="checkbox" required aria-invalid="true" aria-describedby="cs-rules-error"></span>I have read the house rules</label>
  <p class="chu-field-error" id="cs-rules-error">Tick this box to join the server.</p>
</div>

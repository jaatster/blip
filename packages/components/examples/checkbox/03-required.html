<!-- A box that must be ticked: the error is tied to it with aria-describedby, and aria-invalid turns it red. -->
<div class="pp-field" style="max-inline-size:calc(160*var(--pp-pixel))">
  <label class="pp-check"><span class="pp-box pp-checkbox"><input type="checkbox" required aria-invalid="true" aria-describedby="cs-rules-error"></span>I have read the house rules</label>
  <p class="pp-field-error" id="cs-rules-error">Tick this box to join the server.</p>
</div>

<!-- A box that must be ticked: the error is tied to it with aria-describedby, and aria-invalid turns it red. -->
<div class="blip-field" style="max-inline-size:calc(160*var(--blip-pixel))">
  <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" required aria-invalid="true" aria-describedby="cs-rules-error"></span>I have read the house rules</label>
  <p class="blip-field-error" id="cs-rules-error">Tick this box to join the server.</p>
</div>

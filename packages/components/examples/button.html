<!-- Button: every tier, tone, size and state. Forced states use data-pp-state (docs and tests only). -->
<div class="pp-example-grid" style="display:grid;grid-template-columns:max-content repeat(4,max-content);gap:calc(4*var(--pp-pixel)) calc(8*var(--pp-pixel));align-items:center">
  <span></span><span class="pp-label pp-muted">Candy</span><span class="pp-label pp-muted">Soft</span><span class="pp-label pp-muted">Outline</span><span class="pp-label pp-muted">Ghost</span>
  <span class="pp-label pp-muted">Rest</span>
  <button class="pp-box pp-button">Save game</button>
  <button class="pp-box pp-button" data-variant="soft">Save game</button>
  <button class="pp-box pp-button" data-variant="outline">Save game</button>
  <button class="pp-box pp-button" data-variant="ghost">Save game</button>
  <span class="pp-label pp-muted">Hover</span>
  <button class="pp-box pp-button" data-pp-state="hover">Save game</button>
  <button class="pp-box pp-button" data-variant="soft" data-pp-state="hover">Save game</button>
  <button class="pp-box pp-button" data-variant="outline" data-pp-state="hover">Save game</button>
  <button class="pp-box pp-button" data-variant="ghost" data-pp-state="hover">Save game</button>
  <span class="pp-label pp-muted">Focus</span>
  <button class="pp-box pp-button" data-pp-state="focus">Save game</button>
  <button class="pp-box pp-button" data-variant="soft" data-pp-state="focus">Save game</button>
  <button class="pp-box pp-button" data-variant="outline" data-pp-state="focus">Save game</button>
  <button class="pp-box pp-button" data-variant="ghost" data-pp-state="focus">Save game</button>
  <span class="pp-label pp-muted">Pressed</span>
  <button class="pp-box pp-button" data-pp-state="active">Save game</button>
  <button class="pp-box pp-button" data-variant="soft" data-pp-state="active">Save game</button>
  <button class="pp-box pp-button" data-variant="outline" data-pp-state="active">Save game</button>
  <button class="pp-box pp-button" data-variant="ghost" data-pp-state="active">Save game</button>
  <span class="pp-label pp-muted">On</span>
  <button class="pp-box pp-button" aria-pressed="true">Save game</button>
  <button class="pp-box pp-button" data-variant="soft" aria-pressed="true">Save game</button>
  <button class="pp-box pp-button" data-variant="outline" aria-pressed="true">Save game</button>
  <button class="pp-box pp-button" data-variant="ghost" aria-pressed="true">Save game</button>
  <span class="pp-label pp-muted">Disabled</span>
  <button class="pp-box pp-button" disabled>Save game</button>
  <button class="pp-box pp-button" data-variant="soft" disabled>Save game</button>
  <button class="pp-box pp-button" data-variant="outline" disabled>Save game</button>
  <button class="pp-box pp-button" data-variant="ghost" disabled>Save game</button>
  <span class="pp-label pp-muted">Busy</span>
  <button class="pp-box pp-button" aria-busy="true">Save game</button>
  <button class="pp-box pp-button" data-variant="soft" aria-busy="true">Save game</button>
  <button class="pp-box pp-button" data-variant="outline" aria-busy="true">Save game</button>
  <button class="pp-box pp-button" data-variant="ghost" aria-busy="true">Save game</button>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(4*var(--pp-pixel));align-items:center;margin-block:calc(8*var(--pp-pixel))">
  <button class="pp-box pp-button" data-tone="info">Learn more</button>
  <button class="pp-box pp-button" data-tone="success">Claim reward</button>
  <button class="pp-box pp-button" data-tone="warning">Overwrite</button>
  <button class="pp-box pp-button" data-tone="danger">Delete save</button>
  <button class="pp-box pp-button" data-tone="neutral">Cancel</button>
  <button class="pp-box pp-button" data-tone="slate">Credits</button>
  <button class="pp-box pp-button" data-tone="teal">Teal</button>
  <button class="pp-box pp-button" data-tone="pink">Pink</button>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(4*var(--pp-pixel));align-items:center">
  <button class="pp-box pp-button" data-size="sm">Small</button>
  <button class="pp-box pp-button">Medium</button>
  <button class="pp-box pp-button" data-size="lg">Large</button>
  <button class="pp-box pp-button" data-icon-only aria-label="Add level"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2h2v3h3v2H7v3H5V7H2V5h3z"/></svg></button>
  <button class="pp-box pp-button" data-tone="success"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M9 3h2v2h-1v1H9v1H8v1H7v1H6v1H4V9H3V8H2V7H1V5h2v1h1v1h1V6h1V5h1V4h1V3h1z"/></svg>Saved</button>
</div>

<!-- Window: a retro "System" dashboard window with a status bar, a game's pause menu, and tones. Forced states on
     the controls use data-pp-state (docs and tests only). -->
<div class="pp-grid" data-min="160" style="align-items:start">
  <section class="pp-box pp-window" aria-labelledby="win-sys-title">
    <header class="pp-window-bar">
      <h3 class="pp-window-title pp-display pp-pop" id="win-sys-title">System</h3>
      <div class="pp-window-controls">
        <button class="pp-box pp-window-control" data-control="minimize" type="button" aria-label="Minimize System"><span></span></button>
        <button class="pp-box pp-window-control" data-control="maximize" type="button" aria-label="Maximize System"><span></span></button>
        <button class="pp-box pp-window-control" data-control="close" type="button" aria-label="Close System"><span></span></button>
      </div>
    </header>
    <div class="pp-window-body">
      <dl class="pp-grid" data-min="48" data-gap="6">
        <div class="pp-stat"><dt class="pp-stat-label">Memory</dt><dd class="pp-stat-value pp-display pp-pop" data-scale="2" data-tone="teal" data-pop="412 KB">412 KB</dd><dd class="pp-stat-delta" data-trend="up" data-tone="danger">+28 KB</dd></div>
        <div class="pp-stat"><dt class="pp-stat-label">Frame rate</dt><dd class="pp-stat-value pp-display pp-pop" data-scale="2" data-tone="green" data-pop="60">60</dd><dd class="pp-stat-delta" data-trend="flat">Steady</dd></div>
      </dl>
      <hr class="pp-divider" data-variant="dither">
      <ul class="pp-list" role="list" data-density="compact">
        <li class="pp-list-item"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h3v1H4zM3 3h5v1H3zM2 4h7v1H2zM10 4h1v1H10zM1 5h10v1H1zM0 6h12v3H0zM1 9h10v1H1z"/></svg><div class="pp-list-content"><span class="pp-list-title">Cloud save</span></div><div class="pp-list-end">2 min ago</div></li>
        <li class="pp-list-item"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h8v1H2zM1 3h10v1H1zM0 4h2v1H0zM3 4h5v1H3zM9 4h3v1H9zM0 5h1v1H0zM4 5h3v1H4zM8 5h1v1H8zM10 5h2v1H10zM0 6h2v1H0zM3 6h5v1H3zM9 6h3v1H9zM0 7h12v1H0zM0 8h4v1H0zM8 8h4v1H8zM0 9h3v1H0zM9 9h3v1H9zM1 10h1v1H1zM10 10h1v1H10z"/></svg><div class="pp-list-content"><span class="pp-list-title">Gamepad</span></div><div class="pp-list-end">Connected</div></li>
      </ul>
    </div>
    <footer class="pp-window-status"><span>Ready</span><span>Pixel 2 · Day</span></footer>
  </section>

  <section class="pp-box pp-window" data-tone="purple" aria-labelledby="win-pause-title">
    <header class="pp-window-bar">
      <h3 class="pp-window-title pp-display pp-pop" id="win-pause-title">Paused</h3>
      <div class="pp-window-controls">
        <button class="pp-box pp-window-control" data-control="close" type="button" aria-label="Close pause menu"><span></span></button>
      </div>
    </header>
    <div class="pp-window-body">
      <div class="pp-stack" data-gap="4">
        <button class="pp-box pp-button" data-width="full" type="button">Resume</button>
        <button class="pp-box pp-button" data-width="full" data-variant="soft" type="button">Restart level</button>
        <button class="pp-box pp-button" data-width="full" data-variant="soft" type="button">Settings</button>
        <button class="pp-box pp-button" data-width="full" data-variant="soft" data-tone="danger" type="button">Quit to map</button>
      </div>
    </div>
  </section>

  <div class="pp-stack" data-gap="8">
    <section class="pp-box pp-window" data-tone="green" aria-labelledby="win-saved">
      <header class="pp-window-bar">
        <h3 class="pp-window-title pp-display pp-pop" id="win-saved">Saved</h3>
        <div class="pp-window-controls"><button class="pp-box pp-window-control" data-control="close" type="button" aria-label="Close Saved" data-pp-state="hover"><span></span></button></div>
      </header>
      <div class="pp-window-body"><p>Your game was saved to slot 2.</p></div>
    </section>
    <section class="pp-box pp-window" data-tone="orange" aria-labelledby="win-battery">
      <header class="pp-window-bar">
        <h3 class="pp-window-title pp-display pp-pop" id="win-battery">Low battery</h3>
        <div class="pp-window-controls"><button class="pp-box pp-window-control" data-control="close" type="button" aria-label="Close Low battery" data-pp-state="focus"><span></span></button></div>
      </header>
      <div class="pp-window-body"><p>Plug in soon: 10% left.</p></div>
      <footer class="pp-window-status"><span>Battery</span><span>10%</span></footer>
    </section>
  </div>
</div>

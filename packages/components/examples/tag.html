<!-- Tag: tones, tiers and sizes; removable tags; filter chips (aria-pressed) in every state. Forced states use
     data-blip-state (docs and tests only). -->
<div class="blip-cluster">
  <span class="blip-box blip-tag">Accent</span>
  <span class="blip-box blip-tag" data-tone="info">Info</span>
  <span class="blip-box blip-tag" data-tone="success">Cleared</span>
  <span class="blip-box blip-tag" data-tone="warning">2 h left</span>
  <span class="blip-box blip-tag" data-tone="danger">Out</span>
  <span class="blip-box blip-tag" data-tone="neutral">Away</span>
  <span class="blip-box blip-tag" data-tone="purple">Rare</span>
  <span class="blip-box blip-tag" data-tone="pink">Event</span>
  <span class="blip-box blip-tag" data-tone="teal">Co-op</span>
  <span class="blip-box blip-tag" data-tone="slate">Beta</span>
</div>

<div class="blip-cluster" style="margin-block-start:calc(6*var(--blip-pixel))">
  <span class="blip-box blip-tag" data-variant="candy" data-tone="pink">Candy</span>
  <span class="blip-box blip-tag" data-tone="pink">Soft</span>
  <span class="blip-box blip-tag" data-variant="outline">Outline</span>
  <span class="blip-box blip-tag" data-variant="ghost">Ghost</span>
  <span class="blip-box blip-tag" data-size="sm" data-tone="success">Small</span>
  <span class="blip-box blip-tag" data-tone="success">Medium</span>
  <span class="blip-box blip-tag" data-size="lg" data-tone="success">Large</span>
  <span class="blip-box blip-tag" data-size="lg" data-tone="orange"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h1v1h1v1h1V3h1V2h2v1h1v1h1V3h1V2h1v5H1zm2 3v1h1V5zm5 0v1h1V5zM1 8h10v2H1z"/></svg>Level 42</span>
</div>

<div class="blip-cluster" style="margin-block-start:calc(6*var(--blip-pixel))" role="group" aria-label="Zones">
  <span class="blip-box blip-tag" data-tone="orange">Lava zone<button class="blip-tag-remove" type="button" aria-label="Remove Lava zone"></button></span>
  <span class="blip-box blip-tag" data-tone="teal">Co-op<button class="blip-tag-remove" type="button" aria-label="Remove Co-op"></button></span>
  <span class="blip-box blip-tag" data-variant="outline">Night<button class="blip-tag-remove" type="button" aria-label="Remove Night"></button></span>
  <span class="blip-box blip-tag" data-size="lg" data-tone="purple">Speedrun<button class="blip-tag-remove" type="button" aria-label="Remove Speedrun"></button></span>
</div>

<div style="display:grid;grid-template-columns:max-content repeat(2,max-content);gap:calc(4*var(--blip-pixel)) calc(10*var(--blip-pixel));align-items:center;margin-block-start:calc(8*var(--blip-pixel))">
  <span></span><span class="blip-label blip-muted">Off</span><span class="blip-label blip-muted">On</span>
  <span class="blip-label blip-muted">Rest</span>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="false">Swords</button>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="true">Swords</button>
  <span class="blip-label blip-muted">Hover</span>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="false" data-blip-state="hover">Swords</button>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="true" data-blip-state="hover">Swords</button>
  <span class="blip-label blip-muted">Focus</span>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="false" data-blip-state="focus">Swords</button>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="true" data-blip-state="focus">Swords</button>
  <span class="blip-label blip-muted">Soft</span>
  <button class="blip-box blip-tag" type="button" aria-pressed="false">Potions</button>
  <button class="blip-box blip-tag" type="button" aria-pressed="true">Potions</button>
  <span class="blip-label blip-muted">Disabled</span>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="false" disabled>Bows</button>
  <button class="blip-box blip-tag" data-variant="outline" type="button" aria-pressed="true" disabled>Bows</button>
</div>

<!-- Loader: the ring and the dots in every size and tone, with and without a visible label. -->
<div style="display:grid;grid-template-columns:max-content repeat(3,max-content);gap:calc(6*var(--pp-pixel)) calc(12*var(--pp-pixel));align-items:center">
  <span></span><span class="pp-label pp-muted">sm</span><span class="pp-label pp-muted">md</span><span class="pp-label pp-muted">lg</span>
  <span class="pp-label pp-muted">Ring</span>
  <span class="pp-loader" data-size="sm" role="status"><span class="pp-sr-only">Loading</span></span>
  <span class="pp-loader" role="status"><span class="pp-sr-only">Loading</span></span>
  <span class="pp-loader" data-size="lg" role="status"><span class="pp-sr-only">Loading</span></span>
  <span class="pp-label pp-muted">Dots</span>
  <span class="pp-loader" data-variant="dots" data-size="sm" role="status"><span class="pp-sr-only">Loading</span></span>
  <span class="pp-loader" data-variant="dots" role="status"><span class="pp-sr-only">Loading</span></span>
  <span class="pp-loader" data-variant="dots" data-size="lg" role="status"><span class="pp-sr-only">Loading</span></span>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(6*var(--pp-pixel)) calc(12*var(--pp-pixel));align-items:center;margin-block:calc(10*var(--pp-pixel))">
  <span class="pp-loader" role="status">Loading World 2…</span>
  <span class="pp-loader" data-tone="success" role="status">Syncing saves</span>
  <span class="pp-loader" data-tone="warning" data-variant="dots" role="status">Reconnecting</span>
  <span class="pp-loader" data-tone="danger" role="status">Retrying upload</span>
  <span class="pp-loader" data-tone="info" data-size="sm" role="status">Checking for updates</span>
</div>

<div class="pp-box" data-variant="panel" style="display:grid;place-items:center;gap:calc(4*var(--pp-pixel));padding:calc(16*var(--pp-pixel));max-inline-size:calc(160*var(--pp-pixel))">
  <span class="pp-loader" data-size="lg" role="status" style="flex-direction:column">Loading level 3-2</span>
</div>

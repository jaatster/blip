<!-- Combobox: <blip-combobox> turns a datalist into a filtering list with inline completion. One is shown open.
     Forced states use data-blip-state (docs and tests only). -->
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(130*var(--blip-pixel))),1fr));gap:calc(8*var(--blip-pixel)) calc(12*var(--blip-pixel));align-items:start;min-block-size:calc(150*var(--blip-pixel))">
  <blip-field class="blip-field">
    <label class="blip-field-label" for="cb-world">Start in</label>
    <blip-combobox class="blip-combobox" value="caves" empty-text="No world by that name">
      <span class="blip-box blip-input"><input id="cb-world" name="world" list="cb-worlds" placeholder="Type a world" aria-describedby="cb-world-help"></span>
      <datalist id="cb-worlds">
        <option value="meadow">Meadow</option>
        <option value="caves">Crystal caves</option>
        <option value="sky">Sky islands</option>
        <option value="night">Night market</option>
        <option value="castle">Cloud castle</option>
        <option value="reef">Coral reef</option>
        <option value="volcano">Volcano</option>
      </datalist>
    </blip-combobox>
    <p class="blip-field-help" id="cb-world-help">Type to filter; the first match fills in.</p>
  </blip-field>

  <div class="blip-field">
    <label class="blip-field-label" for="cb-open">Open (for the docs)</label>
    <blip-combobox class="blip-combobox" open>
      <span class="blip-box blip-input"><input id="cb-open" list="cb-friends" value="Bit"></span>
      <datalist id="cb-friends">
        <option value="Bit Boy"></option>
        <option value="Bitmap Betty"></option>
        <option value="Byte Knight"></option>
        <option value="Pixel Pal"></option>
      </datalist>
    </blip-combobox>
  </div>

  <div class="blip-field">
    <label class="blip-field-label" for="cb-invalid">Invite a friend</label>
    <blip-combobox class="blip-combobox">
      <span class="blip-box blip-input"><input id="cb-invalid" list="cb-friends-2" value="Nobody" required aria-invalid="true" aria-describedby="cb-invalid-error"></span>
      <datalist id="cb-friends-2"><option value="Bit Boy"></option><option value="Pixel Pal"></option></datalist>
    </blip-combobox>
    <p class="blip-field-error" id="cb-invalid-error">No player by that name. Check the spelling.</p>
  </div>

  <div class="blip-field">
    <label class="blip-field-label" for="cb-focus">Focus</label>
    <blip-combobox class="blip-combobox">
      <span class="blip-box blip-input" data-blip-state="focus"><input id="cb-focus" list="cb-friends-3" value="Pixel Pal"></span>
      <datalist id="cb-friends-3"><option value="Pixel Pal"></option></datalist>
    </blip-combobox>
  </div>

  <div class="blip-field">
    <label class="blip-field-label" for="cb-disabled">Disabled</label>
    <blip-combobox class="blip-combobox">
      <span class="blip-box blip-input"><input id="cb-disabled" list="cb-friends-4" value="Solo run" disabled></span>
      <datalist id="cb-friends-4"><option value="Solo run"></option></datalist>
    </blip-combobox>
  </div>
</div>

<!-- A birthday: day, month and year in the order the page's language writes them (here British English), with the
     years kept to sensible ones. A short month drops the days it doesn't have. -->
<div class="chu-stack" data-gap="2" lang="en-GB" style="max-inline-size:calc(180*var(--chu-pixel))">
  <label class="chu-field-label" for="whs-born">Date of birth</label>
  <chu-wheel class="chu-box chu-wheel" id="whs-born" name="born" data-type="date" data-width="full" min="1920" max="2026" value="2001-08-31"></chu-wheel>
</div>

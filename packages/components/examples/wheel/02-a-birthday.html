<!-- A birthday: day, month and year in the order the page's language writes them (here British English), with the
     years kept to sensible ones. A short month drops the days it doesn't have. -->
<div class="blip-stack" data-gap="2" lang="en-GB" style="max-inline-size:calc(180*var(--blip-pixel))">
  <label class="blip-field-label" for="whs-born">Date of birth</label>
  <blip-wheel class="blip-box blip-wheel" id="whs-born" name="born" data-type="date" data-width="full" min="1920" max="2026" value="2001-08-31"></blip-wheel>
</div>

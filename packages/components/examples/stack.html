<!-- Stack: the default rhythm, tight and loose gaps, alignment, and a footer pushed to the bottom of a tall column. -->
<div class="blip-grid" data-min="96" style="align-items:stretch">
  <div class="blip-box blip-card" data-size="sm">
    <div class="blip-stack">
      <span class="blip-label blip-muted">Default · 8 pixels</span>
      <h3 class="blip-card-title">Level 3</h3>
      <p class="blip-small">Cross the bridge before the clouds roll in.</p>
      <button class="blip-box blip-button" data-size="sm" type="button">Start</button>
    </div>
  </div>
  <div class="blip-box blip-card" data-size="sm">
    <div class="blip-stack" data-gap="2" data-align="start">
      <span class="blip-label blip-muted">data-gap="2"</span>
      <span class="blip-box blip-tag" data-tone="info">Tight</span>
      <span class="blip-box blip-tag" data-tone="info">Rows</span>
      <span class="blip-box blip-tag" data-tone="info">Of tags</span>
    </div>
  </div>
  <div class="blip-box blip-card" data-size="sm">
    <div class="blip-stack" data-gap="4" data-align="center">
      <span class="blip-label blip-muted">data-align="center"</span>
      <span class="blip-box blip-avatar" data-tone="teal" role="img" aria-label="Kit Moss">KM</span>
      <strong>Kit Moss</strong>
      <span class="blip-small blip-muted">Level 37</span>
    </div>
  </div>
  <div class="blip-box blip-card" data-size="sm" style="min-block-size:calc(96*var(--blip-pixel))">
    <div class="blip-stack" data-gap="4" style="flex:1">
      <span class="blip-label blip-muted">data-push</span>
      <p class="blip-small">The last child is pushed to the bottom of the column.</p>
      <button class="blip-box blip-button" data-size="sm" data-variant="soft" data-push type="button">Pinned to the end</button>
    </div>
  </div>
</div>

<!-- Tooltip: chips drawn statically on all four sides (data-pp-static), a form's help, then live <pp-tooltip>s:
     hover a button for a beat, or Tab to it; Escape hides the tooltip. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(16*var(--pp-pixel));align-items:center">
  <div style="display:inline-flex;flex-direction:column;align-items:center">
    <span class="pp-box pp-tooltip" role="tooltip" data-side="top" data-pp-static>Save to slot 2<span class="pp-tooltip-nub" aria-hidden="true"></span></span>
    <button class="pp-box pp-button" type="button" data-icon-only aria-label="Save"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M0 1h9v1H0zM0 2h2v3H0zM7 2h3v1H7zM7 3h4v1H7zM7 4h5v1H7zM0 5h12v2H0zM0 7h2v3H0zM10 7h2v3H10zM0 10h12v1H0z"/></svg></button>
  </div>
  <div style="display:inline-flex;flex-direction:column;align-items:center">
    <button class="pp-box pp-button" type="button" data-icon-only data-variant="soft" aria-label="Settings"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 0h2v1H5zM2 1h1v1H2zM4 1h4v1H4zM9 1h1v1H9zM1 2h10v1H1zM2 3h3v1H2zM7 3h3v1H7zM1 4h3v1H1zM8 4h3v1H8zM0 5h4v2H0zM8 5h4v2H8zM1 7h3v1H1zM8 7h3v1H8zM2 8h3v1H2zM7 8h3v1H7zM1 9h10v1H1zM2 10h1v1H2zM4 10h4v1H4zM9 10h1v1H9zM5 11h2v1H5z"/></svg></button>
    <span class="pp-box pp-tooltip" role="tooltip" data-side="bottom" data-pp-static>Settings (S)<span class="pp-tooltip-nub" aria-hidden="true"></span></span>
  </div>
  <div style="display:inline-flex;align-items:center">
    <span class="pp-box pp-tooltip" role="tooltip" data-side="left" data-pp-static>Mute music<span class="pp-tooltip-nub" aria-hidden="true"></span></span>
    <button class="pp-box pp-button" type="button" data-icon-only data-variant="outline" aria-label="Mute music"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1h2v1H6zM8 2h2v1H8zM6 2h1v6H6zM10 3h1v2h-1zM3 7h3v1H3zM2 8h4v2H2zM3 10h2v1H3z"/></svg></button>
  </div>
  <div style="display:inline-flex;align-items:center">
    <button class="pp-box pp-button" type="button" data-icon-only data-variant="outline" aria-label="Help"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 0h6v1H3zM2 1h2v1H2zM8 1h2v1H8zM1 2h2v1H1zM9 2h2v2H9zM8 4h2v1H8zM6 5h3v1H6zM5 6h2v2H5zM5 9h2v2H5z"/></svg></button>
    <span class="pp-box pp-tooltip" role="tooltip" data-side="right" data-pp-static>Controls and tips<span class="pp-tooltip-nub" aria-hidden="true"></span></span>
  </div>
  <div style="display:inline-flex;flex-direction:column;align-items:flex-start">
    <span class="pp-box pp-tooltip" role="tooltip" data-side="top" data-pp-static>A longer tip wraps at about 110 pixels, so it stays a small chip and never a paragraph.<span class="pp-tooltip-nub" aria-hidden="true" style="--_pp-nub-x:calc(6*var(--pp-pixel))"></span></span>
    <button class="pp-box pp-button" type="button" data-size="sm" data-variant="outline">Why?</button>
  </div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(16*var(--pp-pixel));align-items:flex-start;margin-block-start:calc(10*var(--pp-pixel))">
  <div class="pp-field" style="inline-size:calc(220*var(--pp-pixel))">
    <span style="display:flex;align-items:center;gap:calc(2*var(--pp-pixel))">
      <label class="pp-field-label" for="ex-player-name" style="white-space:nowrap">Player name</label>
      <span style="display:inline-flex;align-items:center">
        <button class="pp-box pp-button" type="button" data-icon-only data-variant="ghost" data-size="sm" aria-label="About player names" aria-describedby="ex-name-tip"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 0h6v1H3zM2 1h2v1H2zM8 1h2v1H8zM1 2h2v1H1zM9 2h2v2H9zM8 4h2v1H8zM6 5h3v1H6zM5 6h2v2H5zM5 9h2v2H5z"/></svg></button>
        <span class="pp-box pp-tooltip" id="ex-name-tip" role="tooltip" data-side="right" data-pp-static>3 to 12 letters or numbers. Shown on leaderboards.<span class="pp-tooltip-nub" aria-hidden="true"></span></span>
      </span>
    </span>
    <span class="pp-box pp-input" style="inline-size:calc(130*var(--pp-pixel))"><input id="ex-player-name" value="PixelPat" autocomplete="nickname"></span>
  </div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(4*var(--pp-pixel));align-items:center;margin-block-start:calc(10*var(--pp-pixel))">
  <span class="pp-label pp-muted">Live</span>
  <button class="pp-box pp-button" type="button" data-icon-only aria-label="Save" id="tip-save"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M0 1h9v1H0zM0 2h2v3H0zM7 2h3v1H7zM7 3h4v1H7zM7 4h5v1H7zM0 5h12v2H0zM0 7h2v3H0zM10 7h2v3H10zM0 10h12v1H0z"/></svg></button>
  <pp-tooltip for="tip-save">Save to slot 2 (Ctrl+S)</pp-tooltip>
  <button class="pp-box pp-button" type="button" data-icon-only data-variant="soft" aria-label="Settings" id="tip-settings"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 0h2v1H5zM2 1h1v1H2zM4 1h4v1H4zM9 1h1v1H9zM1 2h10v1H1zM2 3h3v1H2zM7 3h3v1H7zM1 4h3v1H1zM8 4h3v1H8zM0 5h4v2H0zM8 5h4v2H8zM1 7h3v1H1zM8 7h3v1H8zM2 8h3v1H2zM7 8h3v1H7zM1 9h10v1H1zM2 10h1v1H2zM4 10h4v1H4zM9 10h1v1H9zM5 11h2v1H5z"/></svg></button>
  <pp-tooltip for="tip-settings" placement="bottom">Settings (S)</pp-tooltip>
  <span class="pp-box pp-input" style="inline-size:calc(90*var(--pp-pixel))"><input id="tip-name" aria-label="Player name" placeholder="Player name"></span>
  <pp-tooltip for="tip-name" placement="right">3 to 12 letters or numbers. Shown on leaderboards.</pp-tooltip>
</div>

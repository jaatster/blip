<!-- The candy box is a wrapper: the native input sits inside it, named by its label. Set the type and autocomplete. -->
<div class="chu-field" style="max-inline-size:calc(160*var(--chu-pixel))">
  <label class="chu-field-label" for="is-email">Email</label>
  <span class="chu-box chu-input"><input id="is-email" name="email" type="email" autocomplete="email" placeholder="pal@example.com"></span>
</div>

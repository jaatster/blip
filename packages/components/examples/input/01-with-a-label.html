<!-- The candy box is a wrapper: the native input sits inside it, named by its label. Set the type and autocomplete. -->
<div class="pp-field" style="max-inline-size:calc(160*var(--pp-pixel))">
  <label class="pp-field-label" for="is-email">Email</label>
  <span class="pp-box pp-input"><input id="is-email" name="email" type="email" autocomplete="email" placeholder="pal@example.com"></span>
</div>

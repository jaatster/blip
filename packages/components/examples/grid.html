<!-- Grid: cards that fit as many columns as they can (96 pixels minimum), small panels at 48, and data-fill keeping
     empty columns for a short list. -->
<ul class="pp-grid" role="list">
  <li class="pp-box pp-card" data-size="sm" data-tone="green"><h3 class="pp-card-title">Meadow</h3><p class="pp-small pp-muted">8 levels</p></li>
  <li class="pp-box pp-card" data-size="sm" data-tone="purple"><h3 class="pp-card-title">Night woods</h3><p class="pp-small pp-muted">10 levels</p></li>
  <li class="pp-box pp-card" data-size="sm" data-tone="orange"><h3 class="pp-card-title">Lava zone</h3><p class="pp-small pp-muted">12 levels</p></li>
  <li class="pp-box pp-card" data-size="sm" data-tone="blue"><h3 class="pp-card-title">Sky port</h3><p class="pp-small pp-muted">9 levels</p></li>
  <li class="pp-box pp-card" data-size="sm" data-tone="pink"><h3 class="pp-card-title">Candy hills</h3><p class="pp-small pp-muted">6 levels</p></li>
</ul>

<div class="pp-grid" data-min="48" data-gap="4" style="margin-block-start:calc(8*var(--pp-pixel))">
  <div class="pp-box pp-stat" data-variant="panel"><span class="pp-stat-label">HP</span><span class="pp-stat-value pp-display" data-scale="2">88</span></div>
  <div class="pp-box pp-stat" data-variant="panel"><span class="pp-stat-label">MP</span><span class="pp-stat-value pp-display" data-scale="2">42</span></div>
  <div class="pp-box pp-stat" data-variant="panel"><span class="pp-stat-label">ATK</span><span class="pp-stat-value pp-display" data-scale="2">17</span></div>
  <div class="pp-box pp-stat" data-variant="panel"><span class="pp-stat-label">DEF</span><span class="pp-stat-value pp-display" data-scale="2">23</span></div>
  <div class="pp-box pp-stat" data-variant="panel"><span class="pp-stat-label">SPD</span><span class="pp-stat-value pp-display" data-scale="2">9</span></div>
  <div class="pp-box pp-stat" data-variant="panel"><span class="pp-stat-label">LCK</span><span class="pp-stat-value pp-display" data-scale="2">5</span></div>
</div>

<div class="pp-grid" data-min="96" data-fill style="margin-block-start:calc(8*var(--pp-pixel))">
  <div class="pp-box pp-card" data-size="sm"><span class="pp-label pp-muted">data-fill</span><p class="pp-small">Two items keep their column width.</p></div>
  <div class="pp-box pp-card" data-size="sm"><span class="pp-label pp-muted">data-fill</span><p class="pp-small">The empty columns stay empty.</p></div>
</div>

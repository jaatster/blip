<!-- A compact friends list: small actions in short rows, still at least 24 px tall. -->
<ol class="blip-box blip-list" role="list" data-density="compact" data-dividers aria-label="Friends">
  <li>
    <blip-swipe-row class="blip-swipe-row">
      <div class="blip-swipe-row-face">
        <div class="blip-list-item"><div class="blip-list-content"><span class="blip-list-title" id="swc-t1">Moss Tanaka</span></div><div class="blip-list-end">Playing</div></div>
        <button class="blip-box blip-button blip-swipe-row-more" type="button" data-variant="ghost" data-size="sm" data-icon-only aria-label="More actions" aria-describedby="swc-t1"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 5h2v2H1zm4 0h2v2H5zm4 0h2v2H9z"/></svg></button>
      </div>
      <div class="blip-swipe-row-actions" data-side="end">
        <button class="blip-box blip-button" type="button" data-size="sm" data-tone="danger">Remove</button>
        <button class="blip-box blip-button" type="button" data-size="sm" data-tone="neutral">Mute</button>
      </div>
    </blip-swipe-row>
  </li>
  <li>
    <blip-swipe-row class="blip-swipe-row">
      <div class="blip-swipe-row-face">
        <div class="blip-list-item"><div class="blip-list-content"><span class="blip-list-title" id="swc-t2">Kit Lark</span></div><div class="blip-list-end">Away</div></div>
        <button class="blip-box blip-button blip-swipe-row-more" type="button" data-variant="ghost" data-size="sm" data-icon-only aria-label="More actions" aria-describedby="swc-t2"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 5h2v2H1zm4 0h2v2H5zm4 0h2v2H9z"/></svg></button>
      </div>
      <div class="blip-swipe-row-actions" data-side="end">
        <button class="blip-box blip-button" type="button" data-size="sm" data-tone="danger">Remove</button>
        <button class="blip-box blip-button" type="button" data-size="sm" data-tone="neutral">Mute</button>
      </div>
    </blip-swipe-row>
  </li>
</ol>

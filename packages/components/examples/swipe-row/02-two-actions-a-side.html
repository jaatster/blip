<!-- Two actions at the end, held open: a full swipe runs the first one, Delete, so it goes first. -->
<ul class="chu-box chu-list" role="list" data-dividers aria-label="Saves">
  <li>
    <chu-swipe-row class="chu-swipe-row" open="end">
      <div class="chu-swipe-row-face">
        <div class="chu-list-item">
          <div class="chu-list-content"><span class="chu-list-title" id="swb-t1">Slot 1</span><span class="chu-list-description">World 4 · 12 h 40 min</span></div>
          <div class="chu-list-end">98%</div>
        </div>
        <button class="chu-box chu-button chu-swipe-row-more" type="button" data-variant="ghost" data-size="sm" data-icon-only aria-label="More actions" aria-describedby="swb-t1"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 5h2v2H1zm4 0h2v2H5zm4 0h2v2H9z"/></svg></button>
      </div>
      <div class="chu-swipe-row-actions" data-side="end">
        <button class="chu-box chu-button" type="button" data-tone="danger">Delete</button>
        <button class="chu-box chu-button" type="button" data-tone="info">Copy</button>
      </div>
    </chu-swipe-row>
  </li>
</ul>

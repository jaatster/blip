<!-- An inbox: swipe a message towards the end to archive it, towards the start to delete it; More opens it with a mouse. -->
<ul class="blip-box blip-list" role="list" data-dividers aria-label="Inbox">
  <li>
    <blip-swipe-row class="blip-swipe-row">
      <div class="blip-swipe-row-face">
        <a class="blip-box blip-list-item" data-variant="ghost" href="#swa-1">
          <span class="blip-list-content"><span class="blip-list-title" id="swa-t1">Pip Bloom</span><span class="blip-list-description">Rematch on World 3?</span></span>
        </a>
        <button class="blip-box blip-button blip-swipe-row-more" type="button" data-variant="ghost" data-size="sm" data-icon-only aria-label="More actions" aria-describedby="swa-t1"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 5h2v2H1zm4 0h2v2H5zm4 0h2v2H9z"/></svg></button>
      </div>
      <div class="blip-swipe-row-actions" data-side="start"><button class="blip-box blip-button" type="button">Archive</button></div>
      <div class="blip-swipe-row-actions" data-side="end"><button class="blip-box blip-button" type="button" data-tone="danger">Delete</button></div>
    </blip-swipe-row>
  </li>
  <li>
    <blip-swipe-row class="blip-swipe-row">
      <div class="blip-swipe-row-face">
        <a class="blip-box blip-list-item" data-variant="ghost" href="#swa-2">
          <span class="blip-list-content"><span class="blip-list-title" id="swa-t2">Juno Reed</span><span class="blip-list-description">Sent you 3 coins</span></span>
        </a>
        <button class="blip-box blip-button blip-swipe-row-more" type="button" data-variant="ghost" data-size="sm" data-icon-only aria-label="More actions" aria-describedby="swa-t2"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 5h2v2H1zm4 0h2v2H5zm4 0h2v2H9z"/></svg></button>
      </div>
      <div class="blip-swipe-row-actions" data-side="start"><button class="blip-box blip-button" type="button">Archive</button></div>
      <div class="blip-swipe-row-actions" data-side="end"><button class="blip-box blip-button" type="button" data-tone="danger">Delete</button></div>
    </blip-swipe-row>
  </li>
</ul>

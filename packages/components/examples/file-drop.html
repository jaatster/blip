<!-- File drop: a live <blip-file-drop>, then fixed pictures of its states and of a filled list (for docs and tests:
     data-blip-state forces a look). -->
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(150*var(--blip-pixel))),1fr));gap:calc(10*var(--blip-pixel));align-items:start">
  <blip-field class="blip-field">
    <span class="blip-field-label" id="fd-label">Screenshots</span>
    <blip-file-drop class="blip-file-drop">
      <label class="blip-box blip-file-drop-zone">
        <input type="file" name="shots" multiple accept="image/png, image/jpeg" aria-labelledby="fd-label" aria-describedby="fd-help">
        <svg class="blip-icon" data-size="lg" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h1v1h1v1h1v1H8V4H7v4H5V4H4v1H2V4h1V3h1V2h1zM1 8h2v1h6V8h2v3H1z"/></svg>
        <strong>Drop screenshots here</strong>
        <span id="fd-help">or click to browse. PNG or JPG, up to 2 MB each.</span>
      </label>
    </blip-file-drop>
  </blip-field>

  <div class="blip-file-drop">
    <label class="blip-box blip-file-drop-zone" data-blip-state="dragover">
      <input type="file" aria-label="Files over the tray" hidden>
      <svg class="blip-icon" data-size="lg" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h1v1h1v1h1v1H8V4H7v4H5V4H4v1H2V4h1V3h1V2h1zM1 8h2v1h6V8h2v3H1z"/></svg>
      <strong>Let go to add them</strong>
      <span>Files over the tray</span>
    </label>
    <ul class="blip-file-drop-list" aria-label="Files">
      <li class="blip-box blip-file-drop-item"><span class="blip-file-drop-name">castle-sunset.png</span><span class="blip-file-drop-size">184 kB</span><button type="button" class="blip-box blip-file-drop-remove" data-variant="ghost" aria-label="Remove castle-sunset.png"><span aria-hidden="true"></span></button></li>
      <li class="blip-box blip-file-drop-item"><span class="blip-file-drop-name">boss-fight-world-3-final-phase-before-the-big-jump.jpg</span><span class="blip-file-drop-size">1.2 MB</span><button type="button" class="blip-box blip-file-drop-remove" data-variant="ghost" aria-label="Remove boss-fight-world-3-final-phase-before-the-big-jump.jpg" data-blip-state="hover"><span aria-hidden="true"></span></button></li>
      <li class="blip-box blip-file-drop-item"><span class="blip-file-drop-name">secret-room.png</span><span class="blip-file-drop-size">96 kB</span><button type="button" class="blip-box blip-file-drop-remove" data-variant="ghost" aria-label="Remove secret-room.png" data-blip-state="focus"><span aria-hidden="true"></span></button></li>
    </ul>
  </div>

  <div class="blip-field">
    <span class="blip-field-label">Focus</span>
    <div class="blip-file-drop">
      <label class="blip-box blip-file-drop-zone" data-blip-state="focus"><input type="file" aria-label="Focus" hidden><strong>Drop a save file</strong><span>or click to browse</span></label>
    </div>
  </div>

  <div class="blip-field">
    <span class="blip-field-label">Invalid</span>
    <div class="blip-file-drop">
      <label class="blip-box blip-file-drop-zone"><input type="file" aria-label="Invalid" aria-invalid="true" aria-describedby="fd-error" style="display:none"><strong>Drop a save file</strong><span>.pixel files only</span></label>
    </div>
    <p class="blip-field-error" id="fd-error">That isn't a save file. Pick a .pixel file.</p>
  </div>

  <div class="blip-field">
    <span class="blip-field-label">Disabled</span>
    <div class="blip-file-drop">
      <label class="blip-box blip-file-drop-zone"><input type="file" aria-label="Disabled" disabled style="display:none"><strong>Uploads are paused</strong><span>Back after the tournament</span></label>
    </div>
  </div>
</div>

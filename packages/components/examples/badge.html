<!-- Badge: counts, words and dots in every tone and tier, then pinned to buttons, avatars and icons. -->
<div style="display:grid;grid-template-columns:max-content repeat(6,max-content);gap:calc(5*var(--pp-pixel)) calc(8*var(--pp-pixel));align-items:center">
  <span></span><span class="pp-label pp-muted">Accent</span><span class="pp-label pp-muted">Info</span><span class="pp-label pp-muted">Success</span><span class="pp-label pp-muted">Warning</span><span class="pp-label pp-muted">Danger</span><span class="pp-label pp-muted">Neutral</span>
  <span class="pp-label pp-muted">Candy</span>
  <span class="pp-box pp-badge">7</span>
  <span class="pp-box pp-badge" data-tone="info">Beta</span>
  <span class="pp-box pp-badge" data-tone="success">New</span>
  <span class="pp-box pp-badge" data-tone="warning">Low</span>
  <span class="pp-box pp-badge" data-tone="danger">99+</span>
  <span class="pp-box pp-badge" data-tone="neutral">12</span>
  <span class="pp-label pp-muted">Soft</span>
  <span class="pp-box pp-badge" data-variant="soft">7</span>
  <span class="pp-box pp-badge" data-variant="soft" data-tone="info">Beta</span>
  <span class="pp-box pp-badge" data-variant="soft" data-tone="success">New</span>
  <span class="pp-box pp-badge" data-variant="soft" data-tone="warning">Low</span>
  <span class="pp-box pp-badge" data-variant="soft" data-tone="danger">99+</span>
  <span class="pp-box pp-badge" data-variant="soft" data-tone="neutral">12</span>
  <span class="pp-label pp-muted">Outline</span>
  <span class="pp-box pp-badge" data-variant="outline">7</span>
  <span class="pp-box pp-badge" data-variant="outline" data-tone="info">Beta</span>
  <span class="pp-box pp-badge" data-variant="outline" data-tone="success">New</span>
  <span class="pp-box pp-badge" data-variant="outline" data-tone="warning">Low</span>
  <span class="pp-box pp-badge" data-variant="outline" data-tone="danger">99+</span>
  <span class="pp-box pp-badge" data-variant="outline" data-tone="neutral">12</span>
  <span class="pp-label pp-muted">Small</span>
  <span class="pp-box pp-badge" data-size="sm">7</span>
  <span class="pp-box pp-badge" data-size="sm" data-tone="info">Beta</span>
  <span class="pp-box pp-badge" data-size="sm" data-tone="success">New</span>
  <span class="pp-box pp-badge" data-size="sm" data-tone="warning">Low</span>
  <span class="pp-box pp-badge" data-size="sm" data-tone="danger">99+</span>
  <span class="pp-box pp-badge" data-size="sm" data-tone="neutral">12</span>
  <span class="pp-label pp-muted">Dot</span>
  <span class="pp-box pp-badge" data-dot role="img" aria-label="Updated"></span>
  <span class="pp-box pp-badge" data-dot data-tone="info" role="img" aria-label="Info"></span>
  <span class="pp-box pp-badge" data-dot data-tone="success" role="img" aria-label="Online"></span>
  <span class="pp-box pp-badge" data-dot data-tone="warning" role="img" aria-label="Away"></span>
  <span class="pp-box pp-badge" data-dot data-tone="danger" role="img" aria-label="Busy"></span>
  <span class="pp-box pp-badge" data-dot data-tone="neutral" role="img" aria-label="Offline"></span>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(10*var(--pp-pixel));align-items:center;margin-block-start:calc(12*var(--pp-pixel))">
  <button class="pp-box pp-button" type="button" data-icon-only data-variant="soft" aria-label="Notifications, 3 new">
    <svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h2v1h1v3h1v2H1V6h1V3h1V2h2zM4 9h4v1H7v1H5v-1H4z"/></svg>
    <span class="pp-box pp-badge" data-tone="danger" data-size="sm" data-position="top-end" aria-hidden="true">3</span>
  </button>
  <button class="pp-box pp-button" type="button" data-icon-only data-variant="outline" aria-label="Messages, 99+ unread">
    <svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h10v8H1zm2 1v1h1V3zm5 0v1h1V3zM4 4v1h1V4zm3 0v1h1V4zM5 5v1h2V5z"/></svg>
    <span class="pp-box pp-badge" data-tone="danger" data-size="sm" data-position="top-end" aria-hidden="true">99+</span>
  </button>
  <button class="pp-box pp-button" type="button" aria-label="Shop, new items">
    Shop
    <span class="pp-box pp-badge" data-dot data-tone="success" data-position="top-end" aria-hidden="true"></span>
  </button>
  <span class="pp-box pp-avatar" data-tone="teal" role="img" aria-label="Kit Moss, online">KM
    <span class="pp-box pp-badge" data-dot data-tone="success" data-position="bottom-end" aria-hidden="true"></span>
  </span>
  <span class="pp-box pp-avatar" data-tone="pink" data-size="lg" role="img" aria-label="Pixel Pat, level 12">PP
    <span class="pp-box pp-badge" data-tone="purple" data-size="sm" data-position="bottom-end" aria-hidden="true">12</span>
  </span>
  <span class="pp-badge-anchor" role="img" aria-label="Trophies, 2 new">
    <svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h10v3h-1v1H9v1H8v1H7v2h2v2H3V9h2V7H4V6H3V5H2V4H1zm1 1v2h1V2zm7 0v2h1V2z"/></svg>
    <span class="pp-box pp-badge" data-tone="success" data-size="sm" data-position="top-end" aria-hidden="true">2</span>
  </span>
  <p class="pp-small">Inventory <span class="pp-box pp-badge" data-tone="neutral" data-size="sm">24</span> slots used</p>
</div>

<!-- Empty state: a save list with nothing in it, and a small one inside a panel. The picture is a 32 x 24 pixel
     SVG coloured with tokens. -->

  <div class="blip-empty-state" style="margin:0">
    <svg class="blip-empty-state-art" viewBox="0 0 32 24" aria-hidden="true"><path style="fill:var(--blip-outline)" d="M1 4h3v1H1zM28 4h3v1H28zM1 5h1v1H1zM4 5h1v1H4zM27 5h1v1H27zM30 5h1v1H30zM2 6h1v1H2zM5 6h1v1H5zM26 6h1v1H26zM29 6h1v1H29zM3 7h1v1H3zM6 7h1v1H6zM9 7h14v1H9zM25 7h1v1H25zM28 7h1v1H28zM4 8h1v1H4zM7 8h2v1H7zM23 8h2v1H23zM27 8h1v1H27zM5 9h1v1H5zM7 9h1v1H7zM24 9h1v1H24zM26 9h1v1H26zM6 10h20v1H6zM6 11h1v9H6zM25 11h1v9H25zM12 13h8v1H12zM12 14h1v2H12zM19 14h1v2H19zM12 16h8v1H12zM6 20h20v1H6z"/><path style="fill:var(--blip-candy-orange-light)" d="M2 5h2v1H2zM28 5h2v1H28zM3 6h2v1H3zM27 6h2v1H27zM4 7h2v1H4zM26 7h2v1H26zM5 8h2v1H5zM25 8h2v1H25zM6 9h1v1H6zM25 9h1v1H25zM7 11h18v1H7z"/><path style="fill:var(--blip-candy-orange)" d="M7 12h18v1H7zM7 13h5v4H7zM20 13h5v4H20zM7 17h18v2H7z"/><path style="fill:var(--blip-candy-orange-shade)" d="M7 19h18v1H7z"/><path style="fill:var(--blip-ink-soft)" d="M9 8h14v1H9zM8 9h16v1H8z"/><path style="fill:var(--blip-candy-cream)" d="M13 14h6v2H13z"/><path style="fill:var(--blip-line-soft)" d="M14 2h1v1H14zM22 2h1v1H22zM11 3h1v1H11z"/></svg>
    <h2 class="blip-empty-state-title">No saves yet</h2>
    <p class="blip-empty-state-text">Start a game and it is saved here after every level. You can keep three.</p>
    <div class="blip-empty-state-actions">
      <button class="blip-box blip-button" type="button">New game</button>
      <button class="blip-box blip-button" type="button" data-variant="ghost">Load from file</button>
    </div>
  </div>

  <div class="blip-box" data-variant="panel" data-blip-r="4" style="inline-size:calc(130*var(--blip-pixel))">
    <div class="blip-empty-state" data-size="sm">
      <svg class="blip-empty-state-art" viewBox="0 0 32 24" aria-hidden="true"><path style="fill:var(--blip-outline)" d="M1 4h3v1H1zM28 4h3v1H28zM1 5h1v1H1zM4 5h1v1H4zM27 5h1v1H27zM30 5h1v1H30zM2 6h1v1H2zM5 6h1v1H5zM26 6h1v1H26zM29 6h1v1H29zM3 7h1v1H3zM6 7h1v1H6zM9 7h14v1H9zM25 7h1v1H25zM28 7h1v1H28zM4 8h1v1H4zM7 8h2v1H7zM23 8h2v1H23zM27 8h1v1H27zM5 9h1v1H5zM7 9h1v1H7zM24 9h1v1H24zM26 9h1v1H26zM6 10h20v1H6zM6 11h1v9H6zM25 11h1v9H25zM12 13h8v1H12zM12 14h1v2H12zM19 14h1v2H19zM12 16h8v1H12zM6 20h20v1H6z"/><path style="fill:var(--blip-candy-orange-light)" d="M2 5h2v1H2zM28 5h2v1H28zM3 6h2v1H3zM27 6h2v1H27zM4 7h2v1H4zM26 7h2v1H26zM5 8h2v1H5zM25 8h2v1H25zM6 9h1v1H6zM25 9h1v1H25zM7 11h18v1H7z"/><path style="fill:var(--blip-candy-orange)" d="M7 12h18v1H7zM7 13h5v4H7zM20 13h5v4H20zM7 17h18v2H7z"/><path style="fill:var(--blip-candy-orange-shade)" d="M7 19h18v1H7z"/><path style="fill:var(--blip-ink-soft)" d="M9 8h14v1H9zM8 9h16v1H8z"/><path style="fill:var(--blip-candy-cream)" d="M13 14h6v2H13z"/><path style="fill:var(--blip-line-soft)" d="M14 2h1v1H14zM22 2h1v1H22zM11 3h1v1H11z"/></svg>
      <h2 class="blip-empty-state-title">No items</h2>
      <p class="blip-empty-state-text">Open chests to fill your bag.</p>
    </div>
  </div>
</div>

<!-- Skeleton: placeholders for a list of players and for a level card, while they load. The region around them is
     aria-busy (never a .chu-box itself: on a box, aria-busy draws the busy dots) and says what is loading in words;
     the skeletons are hidden from assistive technology. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(12*var(--chu-pixel));align-items:flex-start">
  <div aria-busy="true" style="display:grid;gap:calc(6*var(--chu-pixel));inline-size:calc(140*var(--chu-pixel))">
    <span class="chu-loader" data-size="sm" role="status">Loading friends</span>
    <div aria-hidden="true" style="display:grid;grid-template-columns:auto 1fr;gap:calc(2*var(--chu-pixel)) calc(5*var(--chu-pixel));align-items:center">
      <span class="chu-skeleton" data-shape="circle" style="grid-row:span 2"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:70%;margin-block-end:0"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:45%;margin-block-start:0"></span>
      <span class="chu-skeleton" data-shape="circle" style="grid-row:span 2"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:80%;margin-block-end:0"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:35%;margin-block-start:0"></span>
      <span class="chu-skeleton" data-shape="circle" style="grid-row:span 2"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:60%;margin-block-end:0"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:50%;margin-block-start:0"></span>
    </div>
  </div>

  <div aria-busy="true" style="inline-size:calc(120*var(--chu-pixel))">
  <article class="chu-box chu-card" aria-labelledby="ex-skel-title">
    <h3 class="chu-sr-only" id="ex-skel-title">Level 3-4, loading</h3>
    <span class="chu-skeleton" aria-hidden="true" style="--chu-skeleton-size:calc(56*var(--chu-pixel))"></span>
    <div aria-hidden="true">
      <span class="chu-skeleton" data-shape="text" style="inline-size:65%"></span>
      <span class="chu-skeleton" data-shape="text"></span>
      <span class="chu-skeleton" data-shape="text" style="inline-size:85%"></span>
    </div>
    <span class="chu-skeleton" aria-hidden="true" style="--chu-skeleton-size:calc(20*var(--chu-pixel));inline-size:calc(44*var(--chu-pixel))"></span>
  </article>
  </div>

  <div style="display:grid;gap:calc(2*var(--chu-pixel));inline-size:calc(120*var(--chu-pixel))" aria-hidden="true">
    <span class="chu-label chu-muted">Shapes</span>
    <span class="chu-skeleton" style="--chu-skeleton-size:calc(16*var(--chu-pixel))"></span>
    <span class="chu-skeleton" data-shape="text"></span>
    <span class="chu-skeleton" data-shape="circle" style="--chu-skeleton-size:calc(12*var(--chu-pixel))"></span>
  </div>
</div>

<!-- A speed dial: <chu-fab> opens three labelled mini buttons above the button. The arrow keys move along them, Escape
     closes them and gives focus back. Press the button to try it. -->
<div class="chu-box" data-variant="panel" data-chu-r="4" style="display:grid;inline-size:min(100%,calc(180*var(--chu-pixel)));block-size:calc(170*var(--chu-pixel))">
  <div style="display:flex;flex-direction:column;overflow:auto;mask-image:var(--chu-shape-inner);mask-size:var(--chu-box-mask-size);mask-position:var(--chu-box-mask-position);mask-repeat:no-repeat">
    <header class="chu-box chu-top-bar">
      <h2 class="chu-top-bar-title">Album</h2>
    </header>
    <p class="chu-body" style="padding:calc(6*var(--chu-pixel))">Screenshots, clips and voice notes from your runs.</p>
  </div>
  <chu-fab class="chu-fab-dial" data-position="absolute">
    <button class="chu-box chu-fab" type="button" data-icon-only aria-label="Add"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2h2v3h3v2H7v3H5V7H2V5h3z"/></svg></button>
    <div class="chu-fab-menu" role="menu" aria-label="Add" hidden>
      <button class="chu-box chu-fab-action" type="button" role="menuitem" data-value="screenshot"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2h3v1h4v1h1v5h-1v1H2V9H1V4h1V3h1zm2 2v1h2V4zM4 5v2h1V5zm3 0v2h1V5zM5 7v1h2V7z"/></svg>Screenshot</button>
      <button class="chu-box chu-fab-action" type="button" role="menuitem" data-value="clip"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h10v8H1zm2 2v4h1V7h1V6h1V5h1v1h1v1h1V4z"/></svg>Clip</button>
      <button class="chu-box chu-fab-action" type="button" role="menuitem" data-value="voice"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 1h2v1h1v4h1V4h2v3h-1v1H9v1H7v2H5V9H3V8H2V7H1V4h2v2h1V2h1zM4 6v2h4V6H7v1H5V6z"/></svg>Voice note</button>
    </div>
  </chu-fab>
</div>

<!-- An extended action button: an icon and its label, for an action the icon alone would not explain. Leave room under
     the last line of the screen, so the button never covers it. -->
<div class="blip-box" data-variant="panel" data-blip-r="4" style="display:grid;inline-size:min(100%,calc(180*var(--blip-pixel)));block-size:calc(170*var(--blip-pixel))">
  <div style="display:flex;flex-direction:column;overflow:auto;mask-image:var(--blip-shape-inner);mask-size:var(--blip-box-mask-size);mask-position:var(--blip-box-mask-position);mask-repeat:no-repeat">
    <header class="blip-box blip-top-bar">
      <a class="blip-box blip-button blip-top-bar-back" data-variant="ghost" data-icon-only href="#fab-worlds" aria-label="Back"><span class="blip-icon blip-top-bar-chevron" aria-hidden="true"></span></a>
      <h2 class="blip-top-bar-title">Sky islands</h2>
    </header>
    <div style="display:grid;gap:calc(4*var(--blip-pixel));padding:calc(6*var(--blip-pixel)) calc(6*var(--blip-pixel)) calc(32*var(--blip-pixel))">
      <p class="blip-body">Jump from cloud to cloud, and never look down. Nine levels, three bosses, one very tall tower.</p>
      <p class="blip-small blip-muted">Best run: 12 minutes 40.</p>
    </div>
  </div>
  <button class="blip-box blip-fab" type="button" data-position="absolute" data-tone="success"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2h2v1h2v1h2v1h2v2H9v1H7v1H5v1H3z"/></svg>Start run</button>
</div>

<!-- An extended action button: an icon and its label, for an action the icon alone would not explain. Leave room under
     the last line of the screen, so the button never covers it. -->
<div class="chu-box" data-variant="panel" data-chu-r="4" style="display:grid;inline-size:min(100%,calc(180*var(--chu-pixel)));block-size:calc(170*var(--chu-pixel))">
  <div style="display:flex;flex-direction:column;overflow:auto;mask-image:var(--chu-shape-inner);mask-size:var(--chu-box-mask-size);mask-position:var(--chu-box-mask-position);mask-repeat:no-repeat">
    <header class="chu-box chu-top-bar">
      <a class="chu-box chu-button chu-top-bar-back" data-variant="ghost" data-icon-only href="#fab-worlds" aria-label="Back"><span class="chu-icon chu-top-bar-chevron" aria-hidden="true"></span></a>
      <h2 class="chu-top-bar-title">Sky islands</h2>
    </header>
    <div style="display:grid;gap:calc(4*var(--chu-pixel));padding:calc(6*var(--chu-pixel)) calc(6*var(--chu-pixel)) calc(32*var(--chu-pixel))">
      <p class="chu-body">Jump from cloud to cloud, and never look down. Nine levels, three bosses, one very tall tower.</p>
      <p class="chu-small chu-muted">Best run: 12 minutes 40.</p>
    </div>
  </div>
  <button class="chu-box chu-fab" type="button" data-position="absolute" data-tone="success"><svg class="chu-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2h2v1h2v1h2v1h2v2H9v1H7v1H5v1H3z"/></svg>Start run</button>
</div>

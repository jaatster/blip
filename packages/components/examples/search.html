<!-- Search: a search field with its magnifier and pixel clear button; a filter bar; sizes and states. Forced
     states use data-pp-state (docs and tests only). method="dialog" only keeps this demo on the page: a real
     search form has action="/levels". -->
<search style="display:block;max-inline-size:calc(160*var(--pp-pixel))">
  <form method="dialog">
    <label class="pp-sr-only" for="se-levels">Search levels</label>
    <span class="pp-box pp-input">
      <svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h4v1H2zM1 2h1v1H1zM6 2h1v1H6zM0 3h1v4H0zM7 3h1v4H7zM1 7h1v1H1zM6 7h1v1H6zM2 8h4v1H2zM7 8h1v1H7zM7 9h2v1H7zM8 10h2v1H8zM9 11h2v1H9z"/></svg>
      <input id="se-levels" name="q" type="search" value="ghost house" placeholder="Search levels" enterkeyhint="search">
    </span>
  </form>
</search>

<!-- A filter bar: search, a segmented choice, a select, and the action. -->
<search class="pp-box" data-variant="panel" data-pp-r="4" style="display:flex;flex-wrap:wrap;gap:calc(4*var(--pp-pixel));align-items:center;margin-block:calc(10*var(--pp-pixel));padding:calc(6*var(--pp-pixel))" aria-label="Filter levels">
  <span class="pp-box pp-input" style="flex:1 1 calc(80*var(--pp-pixel))">
    <svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h4v1H2zM1 2h1v1H1zM6 2h1v1H6zM0 3h1v4H0zM7 3h1v4H7zM1 7h1v1H1zM6 7h1v1H6zM2 8h4v1H2zM7 8h1v1H7zM7 9h2v1H7zM8 10h2v1H8zM9 11h2v1H9z"/></svg>
    <input type="search" aria-label="Search levels" placeholder="Search levels">
  </span>
  <pp-segmented class="pp-box pp-segmented" name="se-world" value="all" aria-label="World">
    <button class="pp-box" type="button" value="all" aria-checked="true">All</button>
    <button class="pp-box" type="button" value="w1">World 1</button>
    <button class="pp-box" type="button" value="w2">World 2</button>
  </pp-segmented>
  <span class="pp-box pp-select"><select aria-label="Sort by"><option class="pp-box">Newest first</option><option class="pp-box">Hardest first</option><option class="pp-box">Most played</option></select></span>
  <button class="pp-box pp-button">Filter</button>
</search>

<div style="display:grid;gap:calc(4*var(--pp-pixel));max-inline-size:calc(160*var(--pp-pixel))">
  <span class="pp-box pp-input" data-size="sm"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h4v1H2zM1 2h1v1H1zM6 2h1v1H6zM0 3h1v4H0zM7 3h1v4H7zM1 7h1v1H1zM6 7h1v1H6zM2 8h4v1H2zM7 8h1v1H7zM7 9h2v1H7zM8 10h2v1H8zM9 11h2v1H9z"/></svg><input type="search" aria-label="Search, small" placeholder="Small"></span>
  <span class="pp-box pp-input" data-pp-state="focus"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h4v1H2zM1 2h1v1H1zM6 2h1v1H6zM0 3h1v4H0zM7 3h1v4H7zM1 7h1v1H1zM6 7h1v1H6zM2 8h4v1H2zM7 8h1v1H7zM7 9h2v1H7zM8 10h2v1H8zM9 11h2v1H9z"/></svg><input type="search" aria-label="Search, focused" value="Focus"></span>
  <span class="pp-box pp-input" data-size="lg"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h4v1H2zM1 2h1v1H1zM6 2h1v1H6zM0 3h1v4H0zM7 3h1v4H7zM1 7h1v1H1zM6 7h1v1H6zM2 8h4v1H2zM7 8h1v1H7zM7 9h2v1H7zM8 10h2v1H8zM9 11h2v1H9z"/></svg><input type="search" aria-label="Search, large" value="Large"></span>
  <span class="pp-box pp-input"><svg class="pp-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h4v1H2zM1 2h1v1H1zM6 2h1v1H6zM0 3h1v4H0zM7 3h1v4H7zM1 7h1v1H1zM6 7h1v1H6zM2 8h4v1H2zM7 8h1v1H7zM7 9h2v1H7zM8 10h2v1H8zM9 11h2v1H9z"/></svg><input type="search" aria-label="Search, disabled" placeholder="Search is off offline" disabled></span>
</div>

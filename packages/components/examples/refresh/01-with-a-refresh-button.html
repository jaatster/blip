<!-- A feed that pulls to refresh on a touch screen, with the Refresh button every other way needs. -->
<div class="blip-stack" data-gap="4">
  <blip-refresh class="blip-refresh" id="rfa-feed" style="block-size:calc(80*var(--blip-pixel))">
    <div class="blip-refresh-scroller" tabindex="0" aria-label="Feed">
      <ul class="blip-box blip-list" role="list" data-dividers aria-label="Feed">
        <li class="blip-list-item"><div class="blip-list-content"><span class="blip-list-title">Juno beat your best</span><span class="blip-list-description">World 2 · 2 min ago</span></div></li>
        <li class="blip-list-item"><div class="blip-list-content"><span class="blip-list-title">New level: Candy Caves</span><span class="blip-list-description">World 5 · 1 h ago</span></div></li>
        <li class="blip-list-item"><div class="blip-list-content"><span class="blip-list-title">Pip sent you a gift</span><span class="blip-list-description">Today</span></div></li>
        <li class="blip-list-item"><div class="blip-list-content"><span class="blip-list-title">Weekly cup results</span><span class="blip-list-description">Yesterday</span></div></li>
      </ul>
    </div>
  </blip-refresh>
  <div><button class="blip-box blip-button" type="button" data-variant="soft" onclick="document.getElementById('rfa-feed').refresh()">Refresh</button></div>
</div>

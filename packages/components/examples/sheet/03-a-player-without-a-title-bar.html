<!-- No title bar: the handle sits on the sheet, which is named with aria-label. Its content height first, then 70% of
     the screen for the queue. -->
<button class="chu-box chu-button" type="button" data-variant="soft" data-tone="purple" commandfor="sh-player" command="show-modal">Now playing</button>

<chu-sheet light-dismiss>
  <dialog class="chu-box chu-drawer chu-sheet" id="sh-player" data-snap="content 70%" aria-label="Now playing">
    <button class="chu-box chu-sheet-handle" type="button" data-variant="ghost" aria-label="Show the queue"><span></span></button>
    <div class="chu-dialog-body">
      <p><strong>Crystal Caves (theme)</strong><br>2:14 of 3:30</p>
      <p>Up next: Sky Garden, Clock Tower, The Moon, Credits.</p>
    </div>
  </dialog>
</chu-sheet>

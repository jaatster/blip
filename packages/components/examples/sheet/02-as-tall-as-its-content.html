<!-- With no data-snap it is as tall as its content, with one action. Drag it down to close; the title bar takes the
     drag, so it needs no handle. -->
<button class="blip-box blip-button" type="button" data-variant="soft" commandfor="sh-level" command="show-modal">World 1-4</button>

<blip-sheet light-dismiss>
  <dialog class="blip-box blip-drawer blip-sheet" id="sh-level" data-tone="green" aria-labelledby="sh-level-title">
    <form method="dialog">
      <header class="blip-dialog-header">
        <h2 class="blip-dialog-title" id="sh-level-title">World 1-4</h2>
        <button class="blip-box blip-button blip-dialog-close" data-variant="ghost" data-size="sm" data-icon-only aria-label="Close"><span class="blip-icon" data-glyph="close" aria-hidden="true"></span></button>
      </header>
      <div class="blip-dialog-body"><p>Best time 1:52. Three of three stars.</p></div>
      <footer class="blip-dialog-footer"><button class="blip-box blip-button" data-width="full" value="play">Play</button></footer>
    </form>
  </dialog>
</blip-sheet>

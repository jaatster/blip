<!-- With no data-snap it is as tall as its content, with one action. Drag it down to close; the title bar takes the
     drag, so it needs no handle. -->
<button class="chu-box chu-button" type="button" data-variant="soft" commandfor="sh-level" command="show-modal">World 1-4</button>

<chu-sheet light-dismiss>
  <dialog class="chu-box chu-drawer chu-sheet" id="sh-level" data-tone="green" aria-labelledby="sh-level-title">
    <form method="dialog">
      <header class="chu-dialog-header">
        <h2 class="chu-dialog-title" id="sh-level-title">World 1-4</h2>
        <button class="chu-box chu-button chu-dialog-close" data-variant="ghost" data-size="sm" data-icon-only aria-label="Close"><span class="chu-icon" data-glyph="close" aria-hidden="true"></span></button>
      </header>
      <div class="chu-dialog-body"><p>Best time 1:52. Three of three stars.</p></div>
      <footer class="chu-dialog-footer"><button class="chu-box chu-button" data-width="full" value="play">Play</button></footer>
    </form>
  </dialog>
</chu-sheet>

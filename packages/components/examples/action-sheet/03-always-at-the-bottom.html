<!-- No title, and data-layout="sheet": it stays at the bottom on a wide screen too, as on a phone. -->
<button class="blip-box blip-button" type="button" data-variant="soft" commandfor="as-photo" command="show-modal">Change picture</button>

<blip-action-sheet light-dismiss>
  <dialog class="blip-box blip-drawer blip-action-sheet" id="as-photo" data-layout="sheet" aria-label="Change picture">
    <form method="dialog">
      <div class="blip-action-sheet-actions">
        <button class="blip-box blip-button" data-size="lg" data-width="full" data-variant="soft" value="camera">Take a photo</button>
        <button class="blip-box blip-button" data-size="lg" data-width="full" data-variant="soft" value="library">Choose from library</button>
      </div>
      <button class="blip-box blip-button blip-action-sheet-cancel" data-size="lg" data-width="full" data-variant="soft" data-tone="neutral" value="cancel">Cancel</button>
    </form>
  </dialog>
</blip-action-sheet>

<!-- Field: a sign-up form built from fields (label, control, help, error, count), then the inline layout.
     <pp-field> wires descriptions, errors and counts; method="dialog" only keeps this demo on the page. -->
<form method="dialog" class="pp-box" data-variant="panel" data-pp-r="4" aria-labelledby="su-title" style="display:grid;gap:calc(8*var(--pp-pixel));max-inline-size:calc(200*var(--pp-pixel));padding:calc(10*var(--pp-pixel))">
  <h3 class="pp-title" id="su-title">Make your player</h3>

  <pp-field class="pp-field">
    <label class="pp-field-label" for="su-name">Player name</label>
    <span class="pp-box pp-input"><input id="su-name" name="name" required minlength="3" maxlength="16" value="PixelPal" autocomplete="nickname" spellcheck="false"></span>
    <p class="pp-field-help">Shown on the leaderboard. Letters and numbers.</p>
    <p class="pp-field-count"></p>
  </pp-field>

  <pp-field class="pp-field">
    <label class="pp-field-label" for="su-email">Email</label>
    <span class="pp-box pp-input"><input id="su-email" name="email" type="email" required value="pal@" autocomplete="email"></span>
    <p class="pp-field-error">Enter an email like pal@example.com.</p>
  </pp-field>

  <pp-field class="pp-field">
    <label class="pp-field-label" for="su-password">Password</label>
    <span class="pp-box pp-input"><input id="su-password" name="password" type="password" required minlength="8" autocomplete="new-password"></span>
    <p class="pp-field-help">8 letters or more. A short phrase is easy to remember.</p>
    <p class="pp-field-error"></p>
  </pp-field>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:calc(6*var(--pp-pixel))">
    <pp-field class="pp-field">
      <label class="pp-field-label" for="su-birthday">Birthday</label>
      <span class="pp-box pp-input"><input id="su-birthday" name="birthday" type="date" value="2010-06-21"></span>
    </pp-field>
    <pp-field class="pp-field">
      <label class="pp-field-label" for="su-world">Home world</label>
      <span class="pp-box pp-select"><select id="su-world" name="world"><option class="pp-box">Meadow</option><option class="pp-box" selected>Crystal caves</option><option class="pp-box">Sky islands</option></select></span>
    </pp-field>
  </div>

  <pp-field class="pp-field">
    <label class="pp-field-label" for="su-bio">About you</label>
    <span class="pp-box pp-textarea"><textarea id="su-bio" name="bio" rows="3" maxlength="120">Speedrunner. Still scared of the ghost house.</textarea></span>
    <p class="pp-field-count"></p>
  </pp-field>

  <fieldset class="pp-field">
    <legend class="pp-field-label">Play style</legend>
    <div style="display:flex;flex-wrap:wrap;gap:calc(2*var(--pp-pixel)) calc(10*var(--pp-pixel))">
      <label class="pp-check"><span class="pp-box pp-radio"><input type="radio" name="su-style" value="explore" checked></span>Explorer</label>
      <label class="pp-check"><span class="pp-box pp-radio"><input type="radio" name="su-style" value="speed"></span>Speedrunner</label>
      <label class="pp-check"><span class="pp-box pp-radio"><input type="radio" name="su-style" value="collect"></span>Collector</label>
    </div>
  </fieldset>

  <div><label class="pp-check" data-layout="split">Send me patch notes<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" name="news" checked aria-describedby="su-news"></span></label>
  <p class="pp-check-help" id="su-news">About once a month. No ads.</p></div>

  <pp-field class="pp-field">
    <label class="pp-check"><span class="pp-box pp-checkbox"><input type="checkbox" name="rules" required></span>I have read the house rules</label>
    <p class="pp-field-error"></p>
  </pp-field>

  <div class="pp-button-group">
    <button class="pp-box pp-button" type="submit">Create player</button>
    <button class="pp-box pp-button" type="reset" data-variant="ghost">Start over</button>
  </div>
</form>

<!-- Inline: labels in a column beside their controls. -->
<div class="pp-box" data-variant="panel" data-pp-r="4" style="display:grid;gap:calc(6*var(--pp-pixel));max-inline-size:calc(220*var(--pp-pixel));margin-block-start:calc(12*var(--pp-pixel));padding:calc(10*var(--pp-pixel))">
  <div class="pp-field" data-layout="inline">
    <label class="pp-field-label" for="in2-name">Display name</label>
    <span class="pp-box pp-input"><input id="in2-name" value="Pixel Pal"></span>
  </div>
  <div class="pp-field" data-layout="inline">
    <label class="pp-field-label" for="in2-region">Region</label>
    <span class="pp-box pp-select"><select id="in2-region"><option class="pp-box">Europe</option><option class="pp-box">Americas</option><option class="pp-box">Asia</option></select></span>
    <p class="pp-field-help">Pick the nearest for the smoothest races.</p>
  </div>
  <div class="pp-field" data-layout="inline">
    <label class="pp-field-label" for="in2-code">Friend code</label>
    <span class="pp-box pp-input"><input id="in2-code" value="PP-7731-QX" readonly></span>
  </div>
  <div class="pp-field" data-layout="inline">
    <label class="pp-field-label" for="in2-clan">Clan tag</label>
    <span class="pp-box pp-input"><input id="in2-clan" value="??" aria-invalid="true" aria-describedby="in2-clan-error"></span>
    <p class="pp-field-error" id="in2-clan-error">Tags are 2 to 4 letters.</p>
  </div>
</div>

<!-- One candy button for the main action, soft for the next, outline and ghost for the rest. -->
<div class="blip-cluster">
  <button class="blip-box blip-button">Save game</button>
  <button class="blip-box blip-button" data-variant="soft">Load</button>
  <button class="blip-box blip-button" data-variant="outline">Options</button>
  <button class="blip-box blip-button" data-variant="ghost">Quit</button>
</div>

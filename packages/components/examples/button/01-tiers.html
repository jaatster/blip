<!-- One candy button for the main action, soft for the next, outline and ghost for the rest. -->
<div class="chu-cluster">
  <button class="chu-box chu-button">Save game</button>
  <button class="chu-box chu-button" data-variant="soft">Load</button>
  <button class="chu-box chu-button" data-variant="outline">Options</button>
  <button class="chu-box chu-button" data-variant="ghost">Quit</button>
</div>

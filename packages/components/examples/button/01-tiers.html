<!-- One candy button for the main action, soft for the next, outline and ghost for the rest. -->
<div class="pp-cluster">
  <button class="pp-box pp-button">Save game</button>
  <button class="pp-box pp-button" data-variant="soft">Load</button>
  <button class="pp-box pp-button" data-variant="outline">Options</button>
  <button class="pp-box pp-button" data-variant="ghost">Quit</button>
</div>

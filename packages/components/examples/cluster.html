<!-- Cluster: a wrapping row of tags, a toolbar split to both ends, and a row that switches to a column in a narrow
     container (the two boxes below are the same markup at two widths). -->
<div class="chu-cluster" data-gap="3">
  <span class="chu-box chu-tag" data-tone="success">Cleared</span>
  <span class="chu-box chu-tag" data-tone="purple">Rare</span>
  <span class="chu-box chu-tag" data-tone="teal">Co-op</span>
  <span class="chu-box chu-tag" data-tone="pink">Event</span>
  <span class="chu-box chu-tag" data-tone="orange">Lava zone</span>
  <span class="chu-box chu-tag" data-tone="neutral">Night</span>
  <span class="chu-box chu-tag" data-tone="info">Speedrun</span>
</div>

<div class="chu-cluster" data-justify="between" style="margin-block-start:calc(8*var(--chu-pixel))">
  <div class="chu-cluster" data-gap="2">
    <button class="chu-box chu-button" data-variant="ghost" data-size="sm" type="button">Undo</button>
    <button class="chu-box chu-button" data-variant="ghost" data-size="sm" type="button">Redo</button>
  </div>
  <div class="chu-cluster" data-gap="2">
    <button class="chu-box chu-button" data-variant="soft" data-size="sm" type="button">Preview</button>
    <button class="chu-box chu-button" data-size="sm" type="button">Publish</button>
  </div>
</div>

<div class="chu-cluster" data-gap="8" data-align="start" style="margin-block-start:calc(8*var(--chu-pixel))">
  <div class="chu-box chu-card" data-size="sm" style="inline-size:calc(220*var(--chu-pixel))">
    <span class="chu-label chu-muted">data-switch, wide</span>
    <div class="chu-cluster" data-switch>
      <button class="chu-box chu-button" data-variant="soft" type="button">Cancel</button>
      <button class="chu-box chu-button" type="button">Save game</button>
    </div>
  </div>
  <div class="chu-box chu-card" data-size="sm" style="inline-size:calc(110*var(--chu-pixel))">
    <span class="chu-label chu-muted">Narrow</span>
    <div class="chu-cluster" data-switch>
      <button class="chu-box chu-button" data-variant="soft" type="button">Cancel</button>
      <button class="chu-box chu-button" type="button">Save game</button>
    </div>
  </div>
</div>

<!-- Switch: off and on in every state; sizes; game settings with the label first. Forced states use
     data-pp-state (docs and tests only). -->
<div style="display:grid;grid-template-columns:max-content repeat(2,max-content);gap:calc(4*var(--pp-pixel)) calc(12*var(--pp-pixel));align-items:center">
  <span></span><span class="pp-label pp-muted">Off</span><span class="pp-label pp-muted">On</span>
  <span class="pp-label pp-muted">Rest</span>
  <span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" aria-label="Rest, off"></span>
  <span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" aria-label="Rest, on" checked></span>
  <span class="pp-label pp-muted">Hover</span>
  <span class="pp-box pp-switch" data-pp-state="hover"><input type="checkbox" role="switch" class="pp-box" aria-label="Hover, off"></span>
  <span class="pp-box pp-switch" data-pp-state="hover"><input type="checkbox" role="switch" class="pp-box" aria-label="Hover, on" checked></span>
  <span class="pp-label pp-muted">Focus</span>
  <span class="pp-box pp-switch" data-pp-state="focus"><input type="checkbox" role="switch" class="pp-box" aria-label="Focus, off"></span>
  <span class="pp-box pp-switch" data-pp-state="focus"><input type="checkbox" role="switch" class="pp-box" aria-label="Focus, on" checked></span>
  <span class="pp-label pp-muted">Pressed</span>
  <span class="pp-box pp-switch" data-pp-state="active"><input type="checkbox" role="switch" class="pp-box" aria-label="Pressed, off"></span>
  <span class="pp-box pp-switch" data-pp-state="active"><input type="checkbox" role="switch" class="pp-box" aria-label="Pressed, on" checked></span>
  <span class="pp-label pp-muted">Disabled</span>
  <span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" aria-label="Disabled, off" disabled></span>
  <span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" aria-label="Disabled, on" checked disabled></span>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(4*var(--pp-pixel)) calc(12*var(--pp-pixel));align-items:center;margin-block:calc(10*var(--pp-pixel))">
  <label class="pp-check" data-size="sm"><span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" checked></span>Small</label>
  <label class="pp-check"><span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" checked></span>Medium</label>
  <label class="pp-check" data-size="lg"><span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" checked></span>Large</label>
  <label class="pp-check"><span class="pp-box pp-switch" data-tone="success"><input type="checkbox" role="switch" class="pp-box" checked></span>Success</label>
</div>

<section class="pp-box" data-variant="panel" data-pp-r="4" aria-labelledby="settings-title" style="display:grid;gap:calc(6*var(--pp-pixel));max-inline-size:calc(150*var(--pp-pixel));padding:calc(8*var(--pp-pixel))">
  <h3 class="pp-label" id="settings-title">Game settings</h3>
  <label class="pp-check" data-layout="split">Music<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" checked></span></label>
  <label class="pp-check" data-layout="split">Sound effects<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" checked></span></label>
  <div><label class="pp-check" data-layout="split">Screen shake<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" aria-describedby="gs-shake"></span></label>
  <p class="pp-check-help" id="gs-shake">Off is kinder to your eyes.</p></div>
  <label class="pp-check" data-layout="split">CRT scanlines<span class="pp-box pp-switch" data-tone="pink"><input type="checkbox" role="switch" class="pp-box" checked></span></label>
  <div><label class="pp-check" data-layout="split">Controller rumble<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" disabled aria-describedby="gs-rumble"></span></label>
  <p class="pp-check-help" id="gs-rumble">Plug in a controller first.</p></div>
</section>

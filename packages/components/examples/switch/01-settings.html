<!-- Settings that apply at once: the label first, the switch at the end of the row (data-layout="split"). -->
<div class="pp-stack" style="max-inline-size:calc(160*var(--pp-pixel))">
  <label class="pp-check" data-layout="split">Music<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" name="music" checked></span></label>
  <label class="pp-check" data-layout="split">Screen shake<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" name="shake"></span></label>
  <label class="pp-check" data-layout="split">CRT scanlines<span class="pp-box pp-switch"><input type="checkbox" role="switch" class="pp-box" name="crt"></span></label>
</div>

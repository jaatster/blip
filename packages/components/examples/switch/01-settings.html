<!-- Settings that apply at once: the label first, the switch at the end of the row (data-layout="split"). -->
<div class="blip-stack" style="max-inline-size:calc(160*var(--blip-pixel))">
  <label class="blip-check" data-layout="split">Music<span class="blip-box blip-switch"><input type="checkbox" role="switch" class="blip-box" name="music" checked></span></label>
  <label class="blip-check" data-layout="split">Screen shake<span class="blip-box blip-switch"><input type="checkbox" role="switch" class="blip-box" name="shake"></span></label>
  <label class="blip-check" data-layout="split">CRT scanlines<span class="blip-box blip-switch"><input type="checkbox" role="switch" class="blip-box" name="crt"></span></label>
</div>

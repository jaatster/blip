<!-- Settings that apply at once: the label first, the switch at the end of the row (data-layout="split"). -->
<div class="chu-stack" style="max-inline-size:calc(160*var(--chu-pixel))">
  <label class="chu-check" data-layout="split">Music<span class="chu-box chu-switch"><input type="checkbox" role="switch" class="chu-box" name="music" checked></span></label>
  <label class="chu-check" data-layout="split">Screen shake<span class="chu-box chu-switch"><input type="checkbox" role="switch" class="chu-box" name="shake"></span></label>
  <label class="chu-check" data-layout="split">CRT scanlines<span class="chu-box chu-switch"><input type="checkbox" role="switch" class="chu-box" name="crt"></span></label>
</div>

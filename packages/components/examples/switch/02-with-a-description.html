<!-- A line under the switch that says more, tied to it with aria-describedby. -->
<div style="max-inline-size:calc(160*var(--blip-pixel))">
  <label class="blip-check" data-layout="split">Send me patch notes<span class="blip-box blip-switch"><input type="checkbox" role="switch" class="blip-box" name="news" checked aria-describedby="ss-news"></span></label>
  <p class="blip-check-help" id="ss-news">About once a month. No ads.</p>
</div>

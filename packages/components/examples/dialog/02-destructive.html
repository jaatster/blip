<!-- Something that can't be undone: role="alertdialog", the danger tone, and focus on the safe choice (autofocus). -->
<button class="pp-box pp-button" type="button" data-variant="soft" data-tone="danger" commandfor="ds-delete" command="show-modal">Delete slot 3</button>

<pp-dialog>
  <dialog class="pp-box pp-dialog" id="ds-delete" role="alertdialog" data-tone="danger" data-size="sm" aria-labelledby="ds-delete-title" aria-describedby="ds-delete-text">
    <form method="dialog">
      <header class="pp-dialog-header">
        <span class="pp-dialog-icon" aria-hidden="true"></span>
        <h2 class="pp-dialog-title" id="ds-delete-title">Delete slot 3?</h2>
      </header>
      <div class="pp-dialog-body"><p id="ds-delete-text">World 1-4, 52 min played. You can't undo this.</p></div>
      <footer class="pp-dialog-footer">
        <button class="pp-box pp-button" data-variant="soft" data-tone="neutral" value="keep" autofocus>Keep it</button>
        <button class="pp-box pp-button" data-tone="danger" value="delete">Delete</button>
      </footer>
    </form>
  </dialog>
</pp-dialog>

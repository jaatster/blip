<!-- A button opens it (command="show-modal"); Cancel and the cross close it; Save is the form's one submit button. -->
<button class="blip-box blip-button" type="button" commandfor="ds-quit" command="show-modal">Quit to title</button>

<blip-dialog light-dismiss>
  <dialog class="blip-box blip-dialog" id="ds-quit" data-size="sm" aria-labelledby="ds-quit-title">
    <form method="dialog">
      <header class="blip-dialog-header">
        <h2 class="blip-dialog-title" id="ds-quit-title">Quit to the title screen?</h2>
        <button class="blip-box blip-button blip-dialog-close" type="button" commandfor="ds-quit" command="close" value="cancel" data-variant="ghost" data-size="sm" data-icon-only aria-label="Close"><span class="blip-icon" data-glyph="close" aria-hidden="true"></span></button>
      </header>
      <div class="blip-dialog-body"><p>Your progress since the last save point will be lost.</p></div>
      <footer class="blip-dialog-footer">
        <button class="blip-box blip-button" type="button" commandfor="ds-quit" command="close" value="cancel" data-variant="soft" data-tone="neutral">Keep playing</button>
        <button class="blip-box blip-button" value="quit">Quit</button>
      </footer>
    </form>
  </dialog>
</blip-dialog>

<!-- Tones say what kind of news it is: success, info, warning or danger, each with its pixel sign and a body line. -->
<div class="chu-cluster">
  <button class="chu-box chu-button" type="button" data-tone="success" onclick="document.querySelector('chu-toaster').add({ title: 'Achievement unlocked', body: 'First Flight: clear World 1 without taking a hit.', tone: 'success' })">Success</button>
  <button class="chu-box chu-button" type="button" data-variant="soft" data-tone="warning" onclick="document.querySelector('chu-toaster').add({ title: 'Controller battery low', body: 'About 10 minutes left.', tone: 'warning' })">Warning</button>
  <button class="chu-box chu-button" type="button" data-variant="soft" data-tone="danger" onclick="document.querySelector('chu-toaster').add({ title: 'Couldn’t upload your replay', body: 'Check your connection, then try again.', tone: 'danger', action: { label: 'Try again' } })">Danger</button>
</div>

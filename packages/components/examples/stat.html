<!-- Stat: a week in numbers, in a description list on a grid; up (good news), down (bad news, and good news with
     data-tone), a move that is neither, and flat; a stat in its own panel. -->
<dl class="chu-grid" data-min="128">
  <div class="chu-stat">
    <dt class="chu-stat-label">High score</dt>
    <dd class="chu-stat-value chu-display chu-pop" data-scale="3" data-pop="98,120">98,120</dd>
    <dd class="chu-stat-delta" data-trend="up">+12% vs last week</dd>
  </div>
  <div class="chu-stat">
    <dt class="chu-stat-label">Wins</dt>
    <dd class="chu-stat-value chu-display chu-pop" data-scale="3" data-tone="green" data-pop="27">27</dd>
    <dd class="chu-stat-delta" data-trend="down">-8 vs last week</dd>
  </div>
  <div class="chu-stat">
    <dt class="chu-stat-label">Lives lost</dt>
    <dd class="chu-stat-value chu-display chu-pop" data-scale="3" data-tone="red" data-pop="17">17</dd>
    <dd class="chu-stat-delta" data-trend="down" data-tone="success">-6, fewer is better</dd>
  </div>
  <div class="chu-stat">
    <dt class="chu-stat-label">Coins</dt>
    <dd class="chu-stat-value chu-display chu-pop" data-scale="3" data-tone="orange" data-pop="1,240">1,240</dd>
    <dd class="chu-stat-delta" data-trend="down" data-tone="neutral">-310, spent in the shop</dd>
  </div>
  <div class="chu-stat">
    <dt class="chu-stat-label">Friends</dt>
    <dd class="chu-stat-value chu-display chu-pop" data-scale="3" data-tone="purple" data-pop="8">8</dd>
    <dd class="chu-stat-delta" data-trend="flat">No change</dd>
  </div>
</dl>

<dl class="chu-cluster" data-gap="8" style="margin-block-start:calc(10*var(--chu-pixel))">
  <div class="chu-box chu-stat" data-variant="panel">
    <dt class="chu-stat-label">Play time</dt>
    <dd class="chu-stat-value chu-display" data-scale="2">12:30</dd>
    <dd class="chu-stat-delta" data-trend="up">+1:45 today</dd>
  </div>
  <div class="chu-box chu-stat" data-variant="soft" data-tone="teal">
    <dt class="chu-stat-label">Streak</dt>
    <dd class="chu-stat-value chu-display" data-scale="2">9 days</dd>
    <dd class="chu-stat-delta" data-trend="flat">Best: 14</dd>
  </div>
</dl>

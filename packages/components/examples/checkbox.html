<!-- Checkbox: off, on and "some" in every state; sizes and tones; a real group with help and an error.
     Forced states use data-blip-state (docs and tests only). -->
<div style="display:grid;grid-template-columns:max-content repeat(3,max-content);gap:calc(4*var(--blip-pixel)) calc(12*var(--blip-pixel));align-items:center">
  <span></span><span class="blip-label blip-muted">Off</span><span class="blip-label blip-muted">On</span><span class="blip-label blip-muted">Some</span>
  <span class="blip-label blip-muted">Rest</span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Rest, off"></span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Rest, on" checked></span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Rest, some" data-blip-state="indeterminate"></span>
  <span class="blip-label blip-muted">Hover</span>
  <span class="blip-box blip-checkbox" data-blip-state="hover"><input type="checkbox" aria-label="Hover, off"></span>
  <span class="blip-box blip-checkbox" data-blip-state="hover"><input type="checkbox" aria-label="Hover, on" checked></span>
  <span class="blip-box blip-checkbox" data-blip-state="hover"><input type="checkbox" aria-label="Hover, some" data-blip-state="indeterminate"></span>
  <span class="blip-label blip-muted">Focus</span>
  <span class="blip-box blip-checkbox" data-blip-state="focus"><input type="checkbox" aria-label="Focus, off"></span>
  <span class="blip-box blip-checkbox" data-blip-state="focus"><input type="checkbox" aria-label="Focus, on" checked></span>
  <span class="blip-box blip-checkbox" data-blip-state="focus"><input type="checkbox" aria-label="Focus, some" data-blip-state="indeterminate"></span>
  <span class="blip-label blip-muted">Invalid</span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Invalid, off" aria-invalid="true"></span>
  <span></span><span></span>
  <span class="blip-label blip-muted">Disabled</span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Disabled, off" disabled></span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Disabled, on" checked disabled></span>
  <span class="blip-box blip-checkbox"><input type="checkbox" aria-label="Disabled, some" data-blip-state="indeterminate" disabled></span>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(4*var(--blip-pixel)) calc(12*var(--blip-pixel));align-items:center;margin-block:calc(10*var(--blip-pixel))">
  <label class="blip-check" data-size="sm"><span class="blip-box blip-checkbox"><input type="checkbox" checked></span>Small</label>
  <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" checked></span>Medium</label>
  <label class="blip-check" data-size="lg"><span class="blip-box blip-checkbox"><input type="checkbox" checked></span>Large</label>
  <label class="blip-check"><span class="blip-box blip-checkbox" data-tone="success"><input type="checkbox" checked></span>Success</label>
  <label class="blip-check"><span class="blip-box blip-checkbox" data-tone="pink"><input type="checkbox" checked></span>Pink</label>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(16*var(--blip-pixel));align-items:start">
  <fieldset class="blip-field" aria-describedby="map-help" style="max-inline-size:calc(120*var(--blip-pixel))">
    <legend class="blip-field-label">Show on the map</legend>
    <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" data-blip-state="indeterminate" aria-controls="map-shops map-quests map-secrets"></span>Everything</label>
    <div style="display:grid;gap:calc(2*var(--blip-pixel));padding-inline-start:calc(15*var(--blip-pixel))">
      <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" id="map-shops" checked></span>Shops</label>
      <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" id="map-quests" checked aria-describedby="map-quests-help"></span>Quests</label>
      <p class="blip-check-help" id="map-quests-help">Only the ones you have started.</p>
      <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" id="map-secrets"></span>Secret areas</label>
      <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" disabled></span>Other players (online only)</label>
    </div>
    <p class="blip-field-help" id="map-help">Hidden things stay hidden until you find them.</p>
  </fieldset>

  <div class="blip-field" style="max-inline-size:calc(140*var(--blip-pixel))">
    <label class="blip-check"><span class="blip-box blip-checkbox"><input type="checkbox" required aria-invalid="true" aria-describedby="rules-error"></span>I have read the house rules</label>
    <p class="blip-field-error" id="rules-error">Tick this box to join the server.</p>
  </div>
</div>

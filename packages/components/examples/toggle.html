<!-- Toggle button: a button with aria-pressed. Off looks like any button; on sits in with its bands swapped (the
     calm tiers fill with the soft accent). Script flips aria-pressed on click; these are fixed. -->
<div style="display:grid;grid-template-columns:max-content repeat(4,max-content);gap:calc(4*var(--blip-pixel)) calc(8*var(--blip-pixel));align-items:center">
  <span></span><span class="blip-label blip-muted">Candy</span><span class="blip-label blip-muted">Soft</span><span class="blip-label blip-muted">Outline</span><span class="blip-label blip-muted">Ghost</span>
  <span class="blip-label blip-muted">Off</span>
  <button class="blip-box blip-button" aria-pressed="false">Show grid</button>
  <button class="blip-box blip-button" data-variant="soft" aria-pressed="false">Show grid</button>
  <button class="blip-box blip-button" data-variant="outline" aria-pressed="false">Show grid</button>
  <button class="blip-box blip-button" data-variant="ghost" aria-pressed="false">Show grid</button>
  <span class="blip-label blip-muted">On</span>
  <button class="blip-box blip-button" aria-pressed="true">Show grid</button>
  <button class="blip-box blip-button" data-variant="soft" aria-pressed="true">Show grid</button>
  <button class="blip-box blip-button" data-variant="outline" aria-pressed="true">Show grid</button>
  <button class="blip-box blip-button" data-variant="ghost" aria-pressed="true">Show grid</button>
  <span class="blip-label blip-muted">On, focus</span>
  <button class="blip-box blip-button" aria-pressed="true" data-blip-state="focus">Show grid</button>
  <button class="blip-box blip-button" data-variant="soft" aria-pressed="true" data-blip-state="focus">Show grid</button>
  <button class="blip-box blip-button" data-variant="outline" aria-pressed="true" data-blip-state="focus">Show grid</button>
  <button class="blip-box blip-button" data-variant="ghost" aria-pressed="true" data-blip-state="focus">Show grid</button>
  <span class="blip-label blip-muted">On, disabled</span>
  <button class="blip-box blip-button" aria-pressed="true" disabled>Show grid</button>
  <button class="blip-box blip-button" data-variant="soft" aria-pressed="true" disabled>Show grid</button>
  <button class="blip-box blip-button" data-variant="outline" aria-pressed="true" disabled>Show grid</button>
  <button class="blip-box blip-button" data-variant="ghost" aria-pressed="true" disabled>Show grid</button>
</div>

<!-- Icon toggles keep one name whatever their state: the state is aria-pressed. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(4*var(--blip-pixel));align-items:center;margin-block-start:calc(10*var(--blip-pixel))">
  <button class="blip-box blip-button" data-icon-only data-tone="pink" aria-pressed="true" aria-label="Favourite"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2V2h3v1h1v3h-1v1H9v1H8v1H7v1H5V9H4V8H3V7H2V6H1V3h1z"/></svg></button>
  <button class="blip-box blip-button" data-icon-only data-variant="soft" data-tone="pink" aria-pressed="false" aria-label="Favourite"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2h3v1h2V2h3v1h1v3h-1v1H9v1H8v1H7v1H5V9H4V8H3V7H2V6H1V3h1z"/></svg></button>
  <button class="blip-box blip-button" data-icon-only data-variant="outline" aria-pressed="true" aria-label="Mute music"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h1v8H4V9H3V8H1V4h2V3h1zm3 0h2v1h1v1h1v4h-1v1H9v1H7V9h1V8h1V4H8V3H7zM6 4h1v1h1v2H7v1H6z"/></svg></button>
  <button class="blip-box blip-button" data-icon-only data-variant="outline" aria-pressed="false" aria-label="Show grid"><svg class="blip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h4v4H1zm6 0h4v4H7zM1 7h4v4H1zm6 0h4v4H7z"/></svg></button>
  <button class="blip-box blip-button" data-size="sm" data-variant="soft" data-tone="teal" aria-pressed="true">Snap to pixels</button>
  <button class="blip-box blip-button" data-size="lg" data-variant="soft" data-tone="purple" aria-pressed="false">Turbo</button>
</div>

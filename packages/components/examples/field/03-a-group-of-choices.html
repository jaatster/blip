<!-- A fieldset is a field too: the legend is its label, and the help is tied to the group. -->
<fieldset class="chu-field" aria-describedby="fs-style-help">
  <legend class="chu-field-label">Play style</legend>
  <div class="chu-cluster">
    <label class="chu-check"><span class="chu-box chu-radio"><input type="radio" name="fs-style" value="explore" checked></span>Explorer</label>
    <label class="chu-check"><span class="chu-box chu-radio"><input type="radio" name="fs-style" value="speed"></span>Speedrunner</label>
    <label class="chu-check"><span class="chu-box chu-radio"><input type="radio" name="fs-style" value="collect"></span>Collector</label>
  </div>
  <p class="chu-field-help" id="fs-style-help">You can change it later.</p>
</fieldset>

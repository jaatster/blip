<!-- A fieldset is a field too: the legend is its label, and the help is tied to the group. -->
<fieldset class="pp-field" aria-describedby="fs-style-help">
  <legend class="pp-field-label">Play style</legend>
  <div class="pp-cluster">
    <label class="pp-check"><span class="pp-box pp-radio"><input type="radio" name="fs-style" value="explore" checked></span>Explorer</label>
    <label class="pp-check"><span class="pp-box pp-radio"><input type="radio" name="fs-style" value="speed"></span>Speedrunner</label>
    <label class="pp-check"><span class="pp-box pp-radio"><input type="radio" name="fs-style" value="collect"></span>Collector</label>
  </div>
  <p class="pp-field-help" id="fs-style-help">You can change it later.</p>
</fieldset>

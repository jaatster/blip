<!-- A fieldset is a field too: the legend is its label, and the help is tied to the group. -->
<fieldset class="blip-field" aria-describedby="fs-style-help">
  <legend class="blip-field-label">Play style</legend>
  <div class="blip-cluster">
    <label class="blip-check"><span class="blip-box blip-radio"><input type="radio" name="fs-style" value="explore" checked></span>Explorer</label>
    <label class="blip-check"><span class="blip-box blip-radio"><input type="radio" name="fs-style" value="speed"></span>Speedrunner</label>
    <label class="blip-check"><span class="blip-box blip-radio"><input type="radio" name="fs-style" value="collect"></span>Collector</label>
  </div>
  <p class="blip-field-help" id="fs-style-help">You can change it later.</p>
</fieldset>

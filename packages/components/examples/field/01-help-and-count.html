<!-- A label, the control, help under it and a count that <chu-field> keeps up to date from maxlength. -->
<chu-field class="chu-field" style="max-inline-size:calc(160*var(--chu-pixel))">
  <label class="chu-field-label" for="fs-name">Player name</label>
  <span class="chu-box chu-input"><input id="fs-name" name="name" required minlength="3" maxlength="16" value="PixelPal" autocomplete="nickname" spellcheck="false"></span>
  <p class="chu-field-help">Shown on the leaderboard. Letters and numbers.</p>
  <p class="chu-field-count"></p>
</chu-field>

<!-- A label, the control, help under it and a count that <blip-field> keeps up to date from maxlength. -->
<blip-field class="blip-field" style="max-inline-size:calc(160*var(--blip-pixel))">
  <label class="blip-field-label" for="fs-name">Player name</label>
  <span class="blip-box blip-input"><input id="fs-name" name="name" required minlength="3" maxlength="16" value="PixelPal" autocomplete="nickname" spellcheck="false"></span>
  <p class="blip-field-help">Shown on the leaderboard. Letters and numbers.</p>
  <p class="blip-field-count"></p>
</blip-field>

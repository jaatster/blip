<!-- A label, the control, help under it and a count that <pp-field> keeps up to date from maxlength. -->
<pp-field class="pp-field" style="max-inline-size:calc(160*var(--pp-pixel))">
  <label class="pp-field-label" for="fs-name">Player name</label>
  <span class="pp-box pp-input"><input id="fs-name" name="name" required minlength="3" maxlength="16" value="PixelPal" autocomplete="nickname" spellcheck="false"></span>
  <p class="pp-field-help">Shown on the leaderboard. Letters and numbers.</p>
  <p class="pp-field-count"></p>
</pp-field>

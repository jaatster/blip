<!-- An error says what to do. <chu-field> links it to the input and sets aria-invalid while it shows. -->
<chu-field class="chu-field" style="max-inline-size:calc(160*var(--chu-pixel))">
  <label class="chu-field-label" for="fs-email">Email</label>
  <span class="chu-box chu-input"><input id="fs-email" name="email" type="email" required value="pal@" autocomplete="email"></span>
  <p class="chu-field-error">Enter an email like pal@example.com.</p>
</chu-field>

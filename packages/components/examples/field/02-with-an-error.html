<!-- An error says what to do. <blip-field> links it to the input and sets aria-invalid while it shows. -->
<blip-field class="blip-field" style="max-inline-size:calc(160*var(--blip-pixel))">
  <label class="blip-field-label" for="fs-email">Email</label>
  <span class="blip-box blip-input"><input id="fs-email" name="email" type="email" required value="pal@" autocomplete="email"></span>
  <p class="blip-field-error">Enter an email like pal@example.com.</p>
</blip-field>

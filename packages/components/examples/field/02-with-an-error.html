<!-- An error says what to do. <pp-field> links it to the input and sets aria-invalid while it shows. -->
<pp-field class="pp-field" style="max-inline-size:calc(160*var(--pp-pixel))">
  <label class="pp-field-label" for="fs-email">Email</label>
  <span class="pp-box pp-input"><input id="fs-email" name="email" type="email" required value="pal@" autocomplete="email"></span>
  <p class="pp-field-error">Enter an email like pal@example.com.</p>
</pp-field>

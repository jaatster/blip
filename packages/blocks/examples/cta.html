<!-- CTA bands: on a strip of the world (candy button on pastel), and on a candy band (an outline button, since candy
     never stands on candy). -->
<div style="display:grid;gap:calc(12*var(--pp-pixel))">
  <section class="pp-cta" aria-labelledby="cta-demo-title">
    <pp-world></pp-world>
    <h2 class="pp-cta-title pp-display pp-pop" data-scale="2" data-pop="Catch the first star" id="cta-demo-title">Catch the first star</h2>
    <p class="pp-cta-text">Wishlist Starfall Meadow and we'll send one email on launch day, with a free wallpaper pack. Nothing else.</p>
    <div class="pp-cta-actions">
      <a class="pp-box pp-button" data-size="lg" href="#wishlist">Wishlist now</a>
      <a class="pp-box pp-button" data-size="lg" data-variant="soft" data-tone="neutral" href="#letter">Read the devlog</a>
    </div>
    <div class="pp-cta-ground"></div>
  </section>

  <section class="pp-box pp-cta" data-tone="purple" aria-labelledby="cta-demo-press">
    <h2 class="pp-cta-title pp-display" data-scale="1" id="cta-demo-press">Writing about the game?</h2>
    <p class="pp-cta-text">Screenshots at every time of day, the trailer, logos and a fact sheet, in one download.</p>
    <div class="pp-cta-actions">
      <a class="pp-box pp-button" data-variant="outline" href="#press">Get the press kit</a>
    </div>
  </section>
</div>

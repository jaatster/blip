<!-- Your own keys and names: A sends Space and B sends Shift, Start sends Escape (a pause), and the parts are written
     out so they can be named in the page's language (here German). -->
<blip-touch-pad lang="de" data-show="always" data-position="inline" data-a=" " data-b="Shift" data-start="Escape" aria-label="Spielsteuerung">
  <span class="blip-touch-pad-dpad">
    <span class="blip-box blip-touch-pad-arm" data-dir="up" role="button" aria-label="Hoch" aria-keyshortcuts="ArrowUp"><span></span></span>
    <span class="blip-box blip-touch-pad-arm" data-dir="right" role="button" aria-label="Rechts" aria-keyshortcuts="ArrowRight"><span></span></span>
    <span class="blip-box blip-touch-pad-arm" data-dir="down" role="button" aria-label="Runter" aria-keyshortcuts="ArrowDown"><span></span></span>
    <span class="blip-box blip-touch-pad-arm" data-dir="left" role="button" aria-label="Links" aria-keyshortcuts="ArrowLeft"><span></span></span>
    <span class="blip-box blip-touch-pad-hub" aria-hidden="true"></span>
  </span>
  <span class="blip-box blip-touch-pad-button" data-button="start" role="button" aria-keyshortcuts="Escape">Pause</span>
  <span class="blip-touch-pad-buttons">
    <span class="blip-box blip-touch-pad-button" data-button="b" role="button" aria-keyshortcuts="Shift">B</span>
    <span class="blip-box blip-touch-pad-button" data-button="a" role="button" aria-keyshortcuts="Space">A</span>
  </span>
</blip-touch-pad>

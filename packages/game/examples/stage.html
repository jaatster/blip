<!-- Stage: the sky and ground a game screen sits on, before <blip-world> draws, in each scheme. Bands step up from the
     horizon and dither into each other; nothing is a smooth gradient. -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(120*var(--blip-pixel))),1fr));gap:calc(10*var(--blip-pixel))">
  <section class="blip-stage" data-frame data-blip-scheme="day" aria-label="Day" style="block-size:calc(96*var(--blip-pixel));padding:calc(6*var(--blip-pixel)) calc(8*var(--blip-pixel))">
    <p class="blip-display blip-pop" data-scale="1" data-pop="Day">Day</p>
    <div class="blip-stage-ground"></div>
  </section>
  <section class="blip-stage" data-frame data-blip-scheme="sunset" aria-label="Sunset" style="block-size:calc(96*var(--blip-pixel));padding:calc(6*var(--blip-pixel)) calc(8*var(--blip-pixel))">
    <p class="blip-display blip-pop" data-scale="1" data-pop="Sunset">Sunset</p>
    <div class="blip-stage-ground"></div>
  </section>
  <section class="blip-stage" data-frame data-blip-scheme="night" aria-label="Night" style="block-size:calc(96*var(--blip-pixel));padding:calc(6*var(--blip-pixel)) calc(8*var(--blip-pixel))">
    <p class="blip-display blip-pop" data-scale="1" data-pop="Night">Night</p>
    <div class="blip-stage-ground"></div>
  </section>
</div>

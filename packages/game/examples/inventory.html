<!-- Inventory: a backpack of slots beside the item it has selected. Slot 4 shows the focus ring (data-chu-state, for
     the docs); the moon key is selected. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(10*var(--chu-pixel));align-items:flex-start">
  <section class="chu-box" data-variant="panel" data-chu-r="4" aria-labelledby="bag-title" style="display:grid;gap:calc(6*var(--chu-pixel));padding:calc(8*var(--chu-pixel)) calc(9*var(--chu-pixel)) calc(9*var(--chu-pixel))">
    <h3 id="bag-title" class="chu-label">Backpack <span class="chu-muted">11 / 15</span></h3>
    <chu-inventory class="chu-inventory" aria-labelledby="bag-title" style="--chu-inventory-columns:5">
      <button type="button" class="chu-box chu-slot" data-variant="soft" aria-label="Red potion, 3"><chu-sprite name="potion"></chu-sprite><span class="chu-slot-count chu-display chu-pop" data-scale="1" aria-hidden="true">3</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="uncommon" aria-label="Blue potion, uncommon"><chu-sprite name="potion" data-tone="blue"></chu-sprite></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="rare" aria-selected="true" aria-label="Moon key, rare"><chu-sprite name="key" data-tone="blue"></chu-sprite></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="epic" data-chu-state="focus" aria-label="Dusk gem, epic, 2"><chu-sprite name="gem"></chu-sprite><span class="chu-slot-count chu-display chu-pop" data-scale="1" aria-hidden="true">2</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" aria-label="Coins, 99"><chu-sprite name="coin"></chu-sprite><span class="chu-slot-count chu-display chu-pop" data-scale="1" aria-hidden="true">99</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="uncommon" aria-label="Reed sword, uncommon, equipped"><chu-sprite name="sword" data-tone="green"></chu-sprite><span class="chu-box chu-slot-tag" data-tone="neutral" aria-hidden="true">E</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="rare" aria-label="Lily shield, rare, equipped"><chu-sprite name="shield"></chu-sprite><span class="chu-box chu-slot-tag" data-tone="neutral" aria-hidden="true">E</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="legendary" aria-label="Fallen star, legendary, new"><chu-sprite name="star"></chu-sprite><span class="chu-box chu-slot-tag" data-tone="pink" aria-hidden="true">New</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="epic" aria-label="Heart container, epic"><chu-sprite name="heart"></chu-sprite></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" data-rarity="uncommon" aria-label="Green potion, uncommon, 5"><chu-sprite name="potion" data-tone="green"></chu-sprite><span class="chu-slot-count chu-display chu-pop" data-scale="1" aria-hidden="true">5</span></button>
      <button type="button" class="chu-box chu-slot" data-variant="soft" aria-label="Old chest"><chu-sprite name="chest"></chu-sprite></button>
      <button type="button" class="chu-box chu-slot" data-variant="outline" aria-label="Empty"></button>
      <button type="button" class="chu-box chu-slot" data-variant="outline" aria-label="Empty"></button>
      <button type="button" class="chu-box chu-slot" data-variant="outline" aria-label="Empty"></button>
      <button type="button" class="chu-box chu-slot" data-variant="outline" aria-label="Empty"></button>
    </chu-inventory>
  </section>

  <section class="chu-box" data-variant="panel" data-chu-r="4" aria-label="Selected item" style="display:grid;gap:calc(4*var(--chu-pixel));inline-size:calc(132*var(--chu-pixel));padding:calc(8*var(--chu-pixel)) calc(9*var(--chu-pixel)) calc(9*var(--chu-pixel))">
    <div style="display:flex;gap:calc(6*var(--chu-pixel));align-items:center">
      <span class="chu-box chu-slot" data-variant="soft" data-rarity="rare" style="flex:none"><chu-sprite name="key" data-tone="blue"></chu-sprite></span>
      <div>
        <h3 class="chu-title" style="font-size:var(--chu-size-lead)">Moon key</h3>
        <p class="chu-label" style="color:var(--chu-info-text)">Rare</p>
      </div>
    </div>
    <p class="chu-small">Opens the gate at the end of Puddle Path. It hums quietly when the moon is out.</p>
    <div style="display:flex;gap:calc(3*var(--chu-pixel));margin-block-start:calc(2*var(--chu-pixel))">
      <button type="button" class="chu-box chu-button" data-size="sm">Use</button>
      <button type="button" class="chu-box chu-button" data-size="sm" data-variant="ghost">Drop</button>
    </div>
  </section>
</div>

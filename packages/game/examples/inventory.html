<!-- Inventory: a backpack of slots beside the item it has selected. Slot 4 shows the focus ring (data-blip-state, for
     the docs); the moon key is selected. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(10*var(--blip-pixel));align-items:flex-start">
  <section class="blip-box" data-variant="panel" data-blip-r="4" aria-labelledby="bag-title" style="display:grid;gap:calc(6*var(--blip-pixel));padding:calc(8*var(--blip-pixel)) calc(9*var(--blip-pixel)) calc(9*var(--blip-pixel))">
    <h3 id="bag-title" class="blip-label">Backpack <span class="blip-muted">11 / 15</span></h3>
    <blip-inventory class="blip-inventory" aria-labelledby="bag-title" style="--blip-inventory-columns:5">
      <button type="button" class="blip-box blip-slot" data-variant="soft" aria-label="Red potion, 3"><blip-sprite name="potion"></blip-sprite><span class="blip-slot-count blip-display blip-pop" data-scale="1" aria-hidden="true">3</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="uncommon" aria-label="Blue potion, uncommon"><blip-sprite name="potion" data-tone="blue"></blip-sprite></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="rare" aria-selected="true" aria-label="Moon key, rare"><blip-sprite name="key" data-tone="blue"></blip-sprite></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="epic" data-blip-state="focus" aria-label="Dusk gem, epic, 2"><blip-sprite name="gem"></blip-sprite><span class="blip-slot-count blip-display blip-pop" data-scale="1" aria-hidden="true">2</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" aria-label="Coins, 99"><blip-sprite name="coin"></blip-sprite><span class="blip-slot-count blip-display blip-pop" data-scale="1" aria-hidden="true">99</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="uncommon" aria-label="Reed sword, uncommon, equipped"><blip-sprite name="sword" data-tone="green"></blip-sprite><span class="blip-box blip-slot-tag" data-tone="neutral" aria-hidden="true">E</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="rare" aria-label="Lily shield, rare, equipped"><blip-sprite name="shield"></blip-sprite><span class="blip-box blip-slot-tag" data-tone="neutral" aria-hidden="true">E</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="legendary" aria-label="Fallen star, legendary, new"><blip-sprite name="star"></blip-sprite><span class="blip-box blip-slot-tag" data-tone="pink" aria-hidden="true">New</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="epic" aria-label="Heart container, epic"><blip-sprite name="heart"></blip-sprite></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" data-rarity="uncommon" aria-label="Green potion, uncommon, 5"><blip-sprite name="potion" data-tone="green"></blip-sprite><span class="blip-slot-count blip-display blip-pop" data-scale="1" aria-hidden="true">5</span></button>
      <button type="button" class="blip-box blip-slot" data-variant="soft" aria-label="Old chest"><blip-sprite name="chest"></blip-sprite></button>
      <button type="button" class="blip-box blip-slot" data-variant="outline" aria-label="Empty"></button>
      <button type="button" class="blip-box blip-slot" data-variant="outline" aria-label="Empty"></button>
      <button type="button" class="blip-box blip-slot" data-variant="outline" aria-label="Empty"></button>
      <button type="button" class="blip-box blip-slot" data-variant="outline" aria-label="Empty"></button>
    </blip-inventory>
  </section>

  <section class="blip-box" data-variant="panel" data-blip-r="4" aria-label="Selected item" style="display:grid;gap:calc(4*var(--blip-pixel));inline-size:calc(132*var(--blip-pixel));padding:calc(8*var(--blip-pixel)) calc(9*var(--blip-pixel)) calc(9*var(--blip-pixel))">
    <div style="display:flex;gap:calc(6*var(--blip-pixel));align-items:center">
      <span class="blip-box blip-slot" data-variant="soft" data-rarity="rare" style="flex:none"><blip-sprite name="key" data-tone="blue"></blip-sprite></span>
      <div>
        <h3 class="blip-title" style="font-size:var(--blip-size-lead)">Moon key</h3>
        <p class="blip-label" style="color:var(--blip-info-text)">Rare</p>
      </div>
    </div>
    <p class="blip-small">Opens the gate at the end of Puddle Path. It hums quietly when the moon is out.</p>
    <div style="display:flex;gap:calc(3*var(--blip-pixel));margin-block-start:calc(2*var(--blip-pixel))">
      <button type="button" class="blip-box blip-button" data-size="sm">Use</button>
      <button type="button" class="blip-box blip-button" data-size="sm" data-variant="ghost">Drop</button>
    </div>
  </section>
</div>

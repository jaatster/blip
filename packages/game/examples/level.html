<!-- Level select: World 1 of a platformer, two levels cleared, the third current, the rest locked. -->
<section class="pp-stage" data-frame aria-labelledby="world-1" style="max-inline-size:calc(420*var(--pp-pixel));padding:calc(10*var(--pp-pixel)) calc(14*var(--pp-pixel)) calc(34*var(--pp-pixel))">
  <div style="display:flex;flex-wrap:wrap;gap:calc(2*var(--pp-pixel)) calc(10*var(--pp-pixel));align-items:baseline">
    <h3 id="world-1" class="pp-display pp-pop" data-scale="2" data-pop="World 1: Meadow">World 1: Meadow</h3>
    <p class="pp-label" style="display:inline-flex;gap:calc(3*var(--pp-pixel));align-items:center"><pp-sprite name="star"></pp-sprite>5 of 18 stars</p>
  </div>
  <ol class="pp-level-map" aria-label="Levels">
    <li>
      <button type="button" class="pp-box pp-level" aria-label="Level 1, Sprout Steps: 3 of 3 stars">
        <span class="pp-level-number">1</span>
        <span class="pp-level-stars"><pp-sprite name="star"></pp-sprite><pp-sprite name="star"></pp-sprite><pp-sprite name="star"></pp-sprite></span>
      </button>
      <span class="pp-level-path" aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="pp-box pp-level" aria-label="Level 2, Clover Hill: 2 of 3 stars">
        <span class="pp-level-number">2</span>
        <span class="pp-level-stars"><pp-sprite name="star"></pp-sprite><pp-sprite name="star"></pp-sprite><pp-sprite name="star-empty"></pp-sprite></span>
      </button>
      <span class="pp-level-path" aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="pp-box pp-level" aria-current="step" aria-label="Level 3, Puddle Path: you are here, no stars yet">
        <pp-sprite class="pp-level-here" name="arrow"></pp-sprite>
        <span class="pp-level-number">3</span>
        <span class="pp-level-stars"><pp-sprite name="star-empty"></pp-sprite><pp-sprite name="star-empty"></pp-sprite><pp-sprite name="star-empty"></pp-sprite></span>
      </button>
      <span class="pp-level-path" data-locked aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="pp-box pp-level" aria-disabled="true" aria-label="Level 4: locked, clear level 3 first">
        <pp-sprite name="padlock"></pp-sprite>
      </button>
      <span class="pp-level-path" data-locked aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="pp-box pp-level" data-tone="purple" aria-disabled="true" aria-label="Bonus, Hidden Grotto: locked, find the moon key">
        <pp-sprite name="chest"></pp-sprite>
      </button>
      <span class="pp-level-path" data-locked aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="pp-box pp-level" data-tone="danger" aria-disabled="true" aria-label="Level 5, Bramble Keep, the boss: locked">
        <pp-sprite name="padlock"></pp-sprite>
      </button>
    </li>
  </ol>
  <div class="pp-stage-ground"></div>
</section>

<div style="display:flex;flex-wrap:wrap;gap:calc(8*var(--pp-pixel));align-items:end;margin-block-start:calc(22*var(--pp-pixel))">
  <button type="button" class="pp-box pp-level" data-pp-state="hover" aria-label="Level 1: 3 of 3 stars, hover"><span class="pp-level-number">1</span><span class="pp-level-stars"><pp-sprite name="star"></pp-sprite><pp-sprite name="star"></pp-sprite><pp-sprite name="star"></pp-sprite></span></button>
  <button type="button" class="pp-box pp-level" data-pp-state="focus" aria-label="Level 2: 1 of 3 stars, focus"><span class="pp-level-number">2</span><span class="pp-level-stars"><pp-sprite name="star"></pp-sprite><pp-sprite name="star-empty"></pp-sprite><pp-sprite name="star-empty"></pp-sprite></span></button>
  <button type="button" class="pp-box pp-level" data-tone="teal" aria-label="Level 12: 2 of 3 stars"><span class="pp-level-number">12</span><span class="pp-level-stars"><pp-sprite name="star"></pp-sprite><pp-sprite name="star"></pp-sprite><pp-sprite name="star-empty"></pp-sprite></span></button>
  <button type="button" class="pp-box pp-level" data-tone="pink" aria-label="Bonus: the trophy room"><pp-sprite name="trophy"></pp-sprite></button>
</div>

<!-- Level select: World 1 of a platformer, two levels cleared, the third current, the rest locked. -->
<section class="chu-stage" data-frame aria-labelledby="world-1" style="max-inline-size:calc(420*var(--chu-pixel));padding:calc(10*var(--chu-pixel)) calc(14*var(--chu-pixel)) calc(34*var(--chu-pixel))">
  <div style="display:flex;flex-wrap:wrap;gap:calc(2*var(--chu-pixel)) calc(10*var(--chu-pixel));align-items:baseline">
    <h3 id="world-1" class="chu-display chu-pop" data-scale="2" data-pop="World 1: Meadow">World 1: Meadow</h3>
    <p class="chu-label" style="display:inline-flex;gap:calc(3*var(--chu-pixel));align-items:center"><chu-sprite name="star"></chu-sprite>5 of 18 stars</p>
  </div>
  <ol class="chu-level-map" aria-label="Levels">
    <li>
      <button type="button" class="chu-box chu-level" aria-label="Level 1, Sprout Steps: 3 of 3 stars">
        <span class="chu-level-number">1</span>
        <span class="chu-level-stars"><chu-sprite name="star"></chu-sprite><chu-sprite name="star"></chu-sprite><chu-sprite name="star"></chu-sprite></span>
      </button>
      <span class="chu-level-path" aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="chu-box chu-level" aria-label="Level 2, Clover Hill: 2 of 3 stars">
        <span class="chu-level-number">2</span>
        <span class="chu-level-stars"><chu-sprite name="star"></chu-sprite><chu-sprite name="star"></chu-sprite><chu-sprite name="star-empty"></chu-sprite></span>
      </button>
      <span class="chu-level-path" aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="chu-box chu-level" aria-current="step" aria-label="Level 3, Puddle Path: you are here, no stars yet">
        <chu-sprite class="chu-level-here" name="arrow"></chu-sprite>
        <span class="chu-level-number">3</span>
        <span class="chu-level-stars"><chu-sprite name="star-empty"></chu-sprite><chu-sprite name="star-empty"></chu-sprite><chu-sprite name="star-empty"></chu-sprite></span>
      </button>
      <span class="chu-level-path" data-locked aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="chu-box chu-level" aria-disabled="true" aria-label="Level 4: locked, clear level 3 first">
        <chu-sprite name="padlock"></chu-sprite>
      </button>
      <span class="chu-level-path" data-locked aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="chu-box chu-level" data-tone="purple" aria-disabled="true" aria-label="Bonus, Hidden Grotto: locked, find the moon key">
        <chu-sprite name="chest"></chu-sprite>
      </button>
      <span class="chu-level-path" data-locked aria-hidden="true"></span>
    </li>
    <li>
      <button type="button" class="chu-box chu-level" data-tone="danger" aria-disabled="true" aria-label="Level 5, Bramble Keep, the boss: locked">
        <chu-sprite name="padlock"></chu-sprite>
      </button>
    </li>
  </ol>
  <div class="chu-stage-ground"></div>
</section>

<div style="display:flex;flex-wrap:wrap;gap:calc(8*var(--chu-pixel));align-items:end;margin-block-start:calc(22*var(--chu-pixel))">
  <button type="button" class="chu-box chu-level" data-chu-state="hover" aria-label="Level 1: 3 of 3 stars, hover"><span class="chu-level-number">1</span><span class="chu-level-stars"><chu-sprite name="star"></chu-sprite><chu-sprite name="star"></chu-sprite><chu-sprite name="star"></chu-sprite></span></button>
  <button type="button" class="chu-box chu-level" data-chu-state="focus" aria-label="Level 2: 1 of 3 stars, focus"><span class="chu-level-number">2</span><span class="chu-level-stars"><chu-sprite name="star"></chu-sprite><chu-sprite name="star-empty"></chu-sprite><chu-sprite name="star-empty"></chu-sprite></span></button>
  <button type="button" class="chu-box chu-level" data-tone="teal" aria-label="Level 12: 2 of 3 stars"><span class="chu-level-number">12</span><span class="chu-level-stars"><chu-sprite name="star"></chu-sprite><chu-sprite name="star"></chu-sprite><chu-sprite name="star-empty"></chu-sprite></span></button>
  <button type="button" class="chu-box chu-level" data-tone="pink" aria-label="Bonus: the trophy room"><chu-sprite name="trophy"></chu-sprite></button>
</div>

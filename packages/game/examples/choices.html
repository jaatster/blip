<!-- Choices: a title screen's menu in Pixel Bop, and a shop's list with prices. The pointer follows focus or the
     cursor; here data-pp-state holds it on one choice in each, for the docs. -->
<div style="display:flex;flex-wrap:wrap;gap:calc(16*var(--pp-pixel));align-items:flex-start">
  <section class="pp-stage" data-frame aria-label="Starfall Meadow" style="display:grid;justify-items:center;align-content:start;gap:calc(8*var(--pp-pixel));inline-size:calc(190*var(--pp-pixel));padding:calc(12*var(--pp-pixel)) calc(10*var(--pp-pixel)) calc(26*var(--pp-pixel))">
    <h3 class="pp-display pp-pop" data-scale="2" data-tone="pink" data-pop="Starfall" style="text-align:center">Starfall</h3>
    <pp-choices>
      <ul class="pp-choices" role="list" data-font="display">
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="new">New game</button></li>
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="continue" data-pp-state="focus">Continue</button></li>
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="options">Options</button></li>
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="credits" aria-disabled="true">Credits</button></li>
      </ul>
    </pp-choices>
    <div class="pp-stage-ground"></div>
  </section>

  <section class="pp-box" data-variant="panel" data-pp-r="4" aria-labelledby="shop-title" style="display:grid;gap:calc(5*var(--pp-pixel));padding:calc(8*var(--pp-pixel)) calc(10*var(--pp-pixel)) calc(9*var(--pp-pixel)) calc(6*var(--pp-pixel))">
    <h3 id="shop-title" class="pp-label" style="padding-inline-start:calc(17*var(--pp-pixel))">Bramble's shop <span class="pp-muted">You have 42 coins</span></h3>
    <pp-choices>
      <ul class="pp-choices" role="list">
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="potion"><pp-sprite name="potion"></pp-sprite>Red potion <span class="pp-choice-aside">12</span></button></li>
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="mana" data-pp-state="hover"><pp-sprite name="potion" data-tone="blue"></pp-sprite>Blue potion <span class="pp-choice-aside">18</span></button></li>
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="shield"><pp-sprite name="shield"></pp-sprite>Lily shield <span class="pp-choice-aside">40</span></button></li>
        <li><button type="button" class="pp-box pp-choice" data-variant="ghost" value="key" aria-disabled="true"><pp-sprite name="key" data-tone="blue"></pp-sprite>Moon key <span class="pp-choice-aside">120</span></button></li>
      </ul>
    </pp-choices>
  </section>
</div>

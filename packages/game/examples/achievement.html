<!-- Achievements: toasts in their polite live region, the newest first. -->
<div class="pp-achievements" role="status" style="justify-items:start">
  <div class="pp-box pp-achievement">
    <span class="pp-box pp-achievement-icon"><pp-sprite name="trophy"></pp-sprite><span class="pp-achievement-sparkles"></span></span>
    <p class="pp-achievement-label">Achievement unlocked</p>
    <p class="pp-achievement-title">Early bird</p>
    <p class="pp-achievement-text">Catch a falling star before sunrise.</p>
    <p class="pp-achievement-reward"><pp-sprite name="coin"></pp-sprite>+50</p>
  </div>
  <div class="pp-box pp-achievement" data-tone="purple">
    <span class="pp-box pp-achievement-icon"><pp-sprite name="gem"></pp-sprite><span class="pp-achievement-sparkles"></span></span>
    <p class="pp-achievement-label">Achievement unlocked</p>
    <p class="pp-achievement-title">Gem hoarder</p>
    <p class="pp-achievement-text">Find all six dusk gems in World 1.</p>
  </div>
  <div class="pp-box pp-achievement" data-tone="neutral">
    <span class="pp-box pp-achievement-icon"><pp-sprite name="star"></pp-sprite><span class="pp-achievement-sparkles"></span></span>
    <p class="pp-achievement-label">Secret found</p>
    <p class="pp-achievement-title">Star under the bridge</p>
    <p class="pp-achievement-text">Some stars fall where nobody looks.</p>
  </div>
</div>

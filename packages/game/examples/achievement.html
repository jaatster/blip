<!-- Achievements: toasts in their polite live region, the newest first. -->
<div class="blip-achievements" role="status" style="justify-items:start">
  <div class="blip-box blip-achievement">
    <span class="blip-box blip-achievement-icon"><blip-sprite name="trophy"></blip-sprite><span class="blip-achievement-sparkles"></span></span>
    <p class="blip-achievement-label">Achievement unlocked</p>
    <p class="blip-achievement-title">Early bird</p>
    <p class="blip-achievement-text">Catch a falling star before sunrise.</p>
    <p class="blip-achievement-reward"><blip-sprite name="coin"></blip-sprite>+50</p>
  </div>
  <div class="blip-box blip-achievement" data-tone="purple">
    <span class="blip-box blip-achievement-icon"><blip-sprite name="gem"></blip-sprite><span class="blip-achievement-sparkles"></span></span>
    <p class="blip-achievement-label">Achievement unlocked</p>
    <p class="blip-achievement-title">Gem hoarder</p>
    <p class="blip-achievement-text">Find all six dusk gems in World 1.</p>
  </div>
  <div class="blip-box blip-achievement" data-tone="neutral">
    <span class="blip-box blip-achievement-icon"><blip-sprite name="star"></blip-sprite><span class="blip-achievement-sparkles"></span></span>
    <p class="blip-achievement-label">Secret found</p>
    <p class="blip-achievement-title">Star under the bridge</p>
    <p class="blip-achievement-text">Some stars fall where nobody looks.</p>
  </div>
</div>

<!-- Achievements: toasts in their polite live region, the newest first. -->
<div class="chu-achievements" role="status" style="justify-items:start">
  <div class="chu-box chu-achievement">
    <span class="chu-box chu-achievement-icon"><chu-sprite name="trophy"></chu-sprite><span class="chu-achievement-sparkles"></span></span>
    <p class="chu-achievement-label">Achievement unlocked</p>
    <p class="chu-achievement-title">Early bird</p>
    <p class="chu-achievement-text">Catch a falling star before sunrise.</p>
    <p class="chu-achievement-reward"><chu-sprite name="coin"></chu-sprite>+50</p>
  </div>
  <div class="chu-box chu-achievement" data-tone="purple">
    <span class="chu-box chu-achievement-icon"><chu-sprite name="gem"></chu-sprite><span class="chu-achievement-sparkles"></span></span>
    <p class="chu-achievement-label">Achievement unlocked</p>
    <p class="chu-achievement-title">Gem hoarder</p>
    <p class="chu-achievement-text">Find all six dusk gems in World 1.</p>
  </div>
  <div class="chu-box chu-achievement" data-tone="neutral">
    <span class="chu-box chu-achievement-icon"><chu-sprite name="star"></chu-sprite><span class="chu-achievement-sparkles"></span></span>
    <p class="chu-achievement-label">Secret found</p>
    <p class="chu-achievement-title">Star under the bridge</p>
    <p class="chu-achievement-text">Some stars fall where nobody looks.</p>
  </div>
</div>

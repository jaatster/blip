<!-- Sprites: the whole set at one sprite pixel to one Blip pixel, then the toned ones in a few candies. -->
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(40*var(--pp-pixel)),1fr));gap:calc(6*var(--pp-pixel))">

  <figure class="pp-box" data-variant="panel" data-pp-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--pp-pixel));margin:0;padding:calc(6*var(--pp-pixel)) calc(3*var(--pp-pixel)) calc(4*var(--pp-pixel))"><pp-sprite name="gem"></pp-sprite><figcaption class="pp-caption">gem</figcaption></figure>
  <figure class="pp-box" data-variant="panel" data-pp-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--pp-pixel));margin:0;padding:calc(6*var(--pp-pixel)) calc(3*var(--pp-pixel)) calc(4*var(--pp-pixel))"><pp-sprite name="heart"></pp-sprite><figcaption class="pp-caption">heart</figcaption></figure>

  <figure class="pp-box" data-variant="panel" data-pp-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--pp-pixel));margin:0;padding:calc(6*var(--pp-pixel)) calc(3*var(--pp-pixel)) calc(4*var(--pp-pixel))"><pp-sprite name="star"></pp-sprite><figcaption class="pp-caption">star</figcaption></figure>

<div style="display:flex;flex-wrap:wrap;gap:calc(10*var(--pp-pixel));align-items:end;margin-block-start:calc(10*var(--pp-pixel))">
  <span class="pp-label pp-muted">data-tone</span>
  <span style="display:flex;gap:calc(3*var(--pp-pixel));align-items:end"><pp-sprite name="potion" aria-label="Red potion"></pp-sprite><pp-sprite name="potion" data-tone="blue" aria-label="Blue potion"></pp-sprite><pp-sprite name="potion" data-tone="green" aria-label="Green potion"></pp-sprite><pp-sprite name="potion" data-tone="purple" aria-label="Purple potion"></pp-sprite></span>
  <span style="display:flex;gap:calc(3*var(--pp-pixel));align-items:end"><pp-sprite name="gem" data-tone="teal" aria-label="Teal gem"></pp-sprite><pp-sprite name="gem" data-tone="pink" aria-label="Pink gem"></pp-sprite><pp-sprite name="gem" data-tone="red" aria-label="Red gem"></pp-sprite></span>
  <span style="display:flex;gap:calc(3*var(--pp-pixel));align-items:end"><pp-sprite name="key" data-tone="blue" aria-label="Blue key"></pp-sprite><pp-sprite name="key" data-tone="red" aria-label="Red key"></pp-sprite></span>
  <span style="display:flex;gap:calc(3*var(--pp-pixel));align-items:end"><pp-sprite name="heart" data-tone="blue" aria-label="Shield heart"></pp-sprite><pp-sprite name="shield" data-tone="pink" aria-label="Pink shield"></pp-sprite><pp-sprite name="sword" data-tone="orange" aria-label="Orange sword"></pp-sprite></span>
</div>

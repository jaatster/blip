<!-- Sprites: the whole set at one sprite pixel to one Blip pixel, then the toned ones in a few candies. -->
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(40*var(--chu-pixel)),1fr));gap:calc(6*var(--chu-pixel))">
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="coin"></chu-sprite><figcaption class="chu-caption">coin</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="gem"></chu-sprite><figcaption class="chu-caption">gem</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="heart"></chu-sprite><figcaption class="chu-caption">heart</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="heart-half"></chu-sprite><figcaption class="chu-caption">heart-half</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="heart-empty"></chu-sprite><figcaption class="chu-caption">heart-empty</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="star"></chu-sprite><figcaption class="chu-caption">star</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="star-empty"></chu-sprite><figcaption class="chu-caption">star-empty</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="key"></chu-sprite><figcaption class="chu-caption">key</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="potion"></chu-sprite><figcaption class="chu-caption">potion</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="chest"></chu-sprite><figcaption class="chu-caption">chest</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="trophy"></chu-sprite><figcaption class="chu-caption">trophy</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="padlock"></chu-sprite><figcaption class="chu-caption">padlock</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="sword"></chu-sprite><figcaption class="chu-caption">sword</figcaption></figure>

  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="clock"></chu-sprite><figcaption class="chu-caption">clock</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="pointer"></chu-sprite><figcaption class="chu-caption">pointer</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><chu-sprite name="arrow"></chu-sprite><figcaption class="chu-caption">arrow</figcaption></figure>
  <figure class="chu-box" data-variant="panel" data-chu-r="3" style="display:grid;justify-items:center;align-content:end;gap:calc(4*var(--chu-pixel));margin:0;padding:calc(6*var(--chu-pixel)) calc(3*var(--chu-pixel)) calc(4*var(--chu-pixel))"><span style="display:flex;gap:calc(3*var(--chu-pixel));align-items:center"><chu-sprite name="sparkle"></chu-sprite><chu-sprite name="sparkle-small"></chu-sprite></span><figcaption class="chu-caption">sparkle</figcaption></figure>
</div>

<div style="display:flex;flex-wrap:wrap;gap:calc(10*var(--chu-pixel));align-items:end;margin-block-start:calc(10*var(--chu-pixel))">
  <span class="chu-label chu-muted">data-tone</span>
  <span style="display:flex;gap:calc(3*var(--chu-pixel));align-items:end"><chu-sprite name="potion" aria-label="Red potion"></chu-sprite><chu-sprite name="potion" data-tone="blue" aria-label="Blue potion"></chu-sprite><chu-sprite name="potion" data-tone="green" aria-label="Green potion"></chu-sprite><chu-sprite name="potion" data-tone="purple" aria-label="Purple potion"></chu-sprite></span>
  <span style="display:flex;gap:calc(3*var(--chu-pixel));align-items:end"><chu-sprite name="gem" data-tone="teal" aria-label="Teal gem"></chu-sprite><chu-sprite name="gem" data-tone="pink" aria-label="Pink gem"></chu-sprite><chu-sprite name="gem" data-tone="red" aria-label="Red gem"></chu-sprite></span>
  <span style="display:flex;gap:calc(3*var(--chu-pixel));align-items:end"><chu-sprite name="key" data-tone="blue" aria-label="Blue key"></chu-sprite><chu-sprite name="key" data-tone="red" aria-label="Red key"></chu-sprite></span>
  <span style="display:flex;gap:calc(3*var(--chu-pixel));align-items:end"><chu-sprite name="heart" data-tone="blue" aria-label="Shield heart"></chu-sprite><chu-sprite name="shield" data-tone="pink" aria-label="Pink shield"></chu-sprite><chu-sprite name="sword" data-tone="orange" aria-label="Orange sword"></chu-sprite></span>
</div>

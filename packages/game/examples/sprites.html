<div style="display:flex;flex-wrap:wrap;gap:calc(10*var(--blip-pixel));align-items:end;margin-block-start:calc(10*var(--blip-pixel))">
  <span class="blip-label blip-muted">data-tone</span>
  <span style="display:flex;gap:calc(3*var(--blip-pixel));align-items:end"><blip-sprite name="potion" aria-label="Red potion"></blip-sprite><blip-sprite name="potion" data-tone="blue" aria-label="Blue potion"></blip-sprite><blip-sprite name="potion" data-tone="green" aria-label="Green potion"></blip-sprite><blip-sprite name="potion" data-tone="purple" aria-label="Purple potion"></blip-sprite></span>
  <span style="display:flex;gap:calc(3*var(--blip-pixel));align-items:end"><blip-sprite name="gem" data-tone="teal" aria-label="Teal gem"></blip-sprite><blip-sprite name="gem" data-tone="pink" aria-label="Pink gem"></blip-sprite><blip-sprite name="gem" data-tone="red" aria-label="Red gem"></blip-sprite></span>
  <span style="display:flex;gap:calc(3*var(--blip-pixel));align-items:end"><blip-sprite name="key" data-tone="blue" aria-label="Blue key"></blip-sprite><blip-sprite name="key" data-tone="red" aria-label="Red key"></blip-sprite></span>
  <span style="display:flex;gap:calc(3*var(--blip-pixel));align-items:end"><blip-sprite name="heart" data-tone="blue" aria-label="Shield heart"></blip-sprite><blip-sprite name="shield" data-tone="pink" aria-label="Pink shield"></blip-sprite><blip-sprite name="sword" data-tone="orange" aria-label="Orange sword"></blip-sprite></span>

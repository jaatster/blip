# Builds everything and runs every check: manifests, CSS lint, size budgets, the stylelint rules, the React
# wrappers (types, React 18 and 19), unit, visual and condition tests, Storybook and the docs site. Beside it,
# real-stack installs the packed packages into apps made with the frameworks teams use, and builds and checks them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # the version comes from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # The font build (packages/font) runs .tools/venv/bin/python with fontTools and Brotli (for WOFF2).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Font tools
        run: |
          python -m venv .tools/venv
          .tools/venv/bin/pip install --disable-pip-version-check fonttools==4.68.0 brotli==1.2.1

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Custom Elements Manifests are up to date
        run: pnpm cem:check

      - name: Lint CSS
        run: pnpm lint:css

      - name: Size budgets
        run: pnpm budgets

      - name: Stylelint rules
        run: pnpm --filter @jaatster/blip-stylelint-config test

      - name: React (example typecheck, React 18 and 19)
        run: |
          pnpm --filter @jaatster/blip-react typecheck
          pnpm --filter @jaatster/blip-react test

      - name: Playwright Chromium
        run: pnpm --filter @jaatster/blip-tests exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm --filter @jaatster/blip-tests test

      # Baselines are per platform: Linux ones live in tests/visual/__screenshots__/linux (see visual-baselines.yml).
      - name: Visual tests
        run: pnpm --filter @jaatster/blip-tests test:visual

      # Every example under other conditions (tests/conditions); what is left on purpose is in its known-issues.ts.
      - name: Condition tests
        run: pnpm --filter @jaatster/blip-tests test:conditions

      - name: Storybook
        run: pnpm --filter @jaatster/blip-storybook build

      - name: Docs site
        run: pnpm --filter @jaatster/blip-docs build

      - name: Generated files are committed
        run: git diff --exit-code

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            tests/test-results/
            tests/playwright-report/
          if-no-files-found: ignore

  # Blip as adopters get it (scripts/real-stack.mjs): every package packed, installed from the tarballs into
  # apps made with React and Vite, Vue, Svelte, Next.js (Turbopack and webpack), Tailwind CSS and Astro, each built
  # and served by its framework and checked in Chromium. On every pull request, beside `check`: it takes a few
  # minutes, most of them npm installs. The frameworks come from npm with no lockfile, so each run gets the latest
  # release of every major the apps name.
  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Font tools
        run: |
          python -m venv .tools/venv
          .tools/venv/bin/pip install --disable-pip-version-check fonttools==4.68.0 brotli==1.2.1

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Playwright Chromium
        run: pnpm --filter @jaatster/blip-tests exec playwright install --with-deps chromium

      # npm's download cache, for the apps' installs; it keeps tarballs, not versions.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: real-stack-npm-${{ hashFiles('tests/real-stack/*/package.json') }}
          restore-keys: real-stack-npm-

      - name: Real stack
        run: node scripts/real-stack.mjs --dir "$RUNNER_TEMP/blip-stack"

      - name: Real-stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-stack
          path: |
            ${{ runner.temp }}/blip-stack/results.json
            ${{ runner.temp }}/blip-stack/pack.log
            ${{ runner.temp }}/blip-stack/*/real-stack.log
            ${{ runner.temp }}/blip-stack/*/*/*.png
          if-no-files-found: ignore
